name: Build Android APK from one file
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the app
        run: |
          ls -la
          mkdir www
          cp "$(ls ./*.html | head -n 1)" www/index.html
          test -s www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the Android project (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/app
          npm i -D @capacitor/cli @capacitor/android
          npx cap init SONORA com.example.sonora --web-dir www
          npx cap add android
          npx cap sync android
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
