/* ==========================================================================
   SONORA — 03 local music: tag readers (ID3v2, FLAC, MP4/M4A), LRC parser,
   import pipeline, blob access, offline copies of downloadable tracks.
   Nothing here ever leaves the device.
   ========================================================================== */

const AUDIO_EXT = /\.(mp3|wav|wave|flac|m4a|m4b|aac|ogg|oga|opus|webm|weba|mp4|3gp|amr|aif|aiff)$/i;
const isAudioFile = f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name);

const LOCAL = [];                    // local track objects (metadata only)
const SESSION_BLOBS = new Map();     // used when "remember local music" is off, or IndexedDB is unavailable

/* ---------- byte helpers ---------- */
const readAt = async (file, off, len) => new Uint8Array(await file.slice(off, off + len).arrayBuffer());
const u32be = (u, o) => ((u[o] << 24) | (u[o + 1] << 16) | (u[o + 2] << 8) | u[o + 3]) >>> 0;
const u32le = (u, o) => (u[o] | (u[o + 1] << 8) | (u[o + 2] << 16) | (u[o + 3] << 24)) >>> 0;
const syncsafe = (u, o) => ((u[o] & 127) << 21) | ((u[o + 1] & 127) << 14) | ((u[o + 2] & 127) << 7) | (u[o + 3] & 127);
const ascii = (u, o, n) => String.fromCharCode(...u.subarray(o, o + n));
const utf8 = u => new TextDecoder('utf-8').decode(u);

function decodeText(u, enc) {
  let s;
  if (enc === 1 || enc === 2) {
    let label = enc === 2 ? 'utf-16be' : 'utf-16le', b = u;
    if (u.length >= 2 && u[0] === 0xFF && u[1] === 0xFE) { label = 'utf-16le'; b = u.subarray(2); }
    else if (u.length >= 2 && u[0] === 0xFE && u[1] === 0xFF) { label = 'utf-16be'; b = u.subarray(2); }
    s = new TextDecoder(label).decode(b);
  } else if (enc === 3) s = utf8(u);
  else s = new TextDecoder('windows-1252').decode(u);
  return s.replace(/\u0000+$/g, '').replace(/^﻿/, '');
}
/* find the end of a terminated string inside an ID3 frame */
function termIdx(u, start, enc) {
  if (enc === 1 || enc === 2) { for (let i = start; i + 1 < u.length; i += 2) if (u[i] === 0 && u[i + 1] === 0) return i; return u.length; }
  for (let i = start; i < u.length; i++) if (u[i] === 0) return i;
  return u.length;
}
const termLen = enc => (enc === 1 || enc === 2 ? 2 : 1);
const blobUrlFromBytes = (bytes, mime) => new Blob([bytes], { type: mime || 'image/jpeg' });

/* downscale embedded cover art to a small data URL so metadata stays light */
async function coverToSmallDataUrl(blob, size = 320) {
  try {
    const bmp = await createImageBitmap(blob);
    const s = Math.min(bmp.width, bmp.height);
    const c = document.createElement('canvas'); c.width = c.height = Math.min(size, s);
    c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    return c.toDataURL('image/jpeg', 0.8);
  } catch { return ''; }
}

/* ---------- ID3v2 (MP3, some others) ---------- */
function parseID3(u) {
  if (u.length < 10 || ascii(u, 0, 3) !== 'ID3') return null;
  const ver = u[3], flags = u[5], size = syncsafe(u, 6);
  let p = 10; const end = Math.min(u.length, 10 + size);
  if (flags & 0x40) { p += ver === 4 ? syncsafe(u, p) : u32be(u, p) + 4; }
  const tags = {};
  while (p + 10 <= end) {
    const id = ascii(u, p, 4);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const fsz = ver === 4 ? syncsafe(u, p + 4) : u32be(u, p + 4);
    p += 10;
    if (fsz <= 0 || p + fsz > u.length) break;
    const f = u.subarray(p, p + fsz); p += fsz;
    const enc = f[0];
    if (id[0] === 'T' && id !== 'TXXX') {
      const v = decodeText(f.subarray(1), enc);
      if (id === 'TIT2') tags.title = v;
      else if (id === 'TPE1') tags.artist = v;
      else if (id === 'TALB') tags.album = v;
      else if (id === 'TCON') tags.genre = v.replace(/^\((\d+)\)/, '').trim() || v;
      else if (id === 'TRCK') tags.no = parseInt(v, 10) || undefined;
      else if (id === 'TYER' || id === 'TDRC') tags.year = String(v).slice(0, 4);
      else if (id === 'TLEN') tags.durMs = parseInt(v, 10) || undefined;
    } else if (id === 'TXXX') {
      // user text frame: some taggers store lyrics here (description "LYRICS" / "UNSYNCED LYRICS")
      const t0 = termIdx(f, 1, enc);
      const desc = decodeText(f.subarray(1, t0), enc).toUpperCase().replace(/\s+/g, '');
      if (['LYRICS', 'UNSYNCEDLYRICS', 'USLT'].includes(desc) && !tags.lyrics) tags.lyrics = decodeText(f.subarray(t0 + termLen(enc)), enc);
    } else if (id === 'USLT') {
      const t0 = termIdx(f, 4, enc);
      tags.lyrics = decodeText(f.subarray(t0 + termLen(enc)), enc);
    } else if (id === 'APIC' && !tags.picture) {
      const m0 = termIdx(f, 1, 0);
      const mime = ascii(f, 1, m0 - 1) || 'image/jpeg';
      const d0 = termIdx(f, m0 + 2, enc);
      tags.picture = { mime, bytes: f.subarray(d0 + termLen(enc)) };
    }
  }
  return { tags, totalSize: 10 + size };
}

/* ---------- FLAC ---------- */
function parseFlac(u) {
  if (u.length < 8 || ascii(u, 0, 4) !== 'fLaC') return null;
  const tags = {}; let p = 4;
  while (p + 4 <= u.length) {
    const last = u[p] & 0x80, type = u[p] & 0x7F, len = (u[p + 1] << 16) | (u[p + 2] << 8) | u[p + 3];
    p += 4;
    if (p + len > u.length) break;
    const b = u.subarray(p, p + len);
    if (type === 0 && len >= 18) {
      const sr = (b[10] << 12) | (b[11] << 4) | (b[12] >> 4);
      const total = (b[13] & 0x0F) * 4294967296 + u32be(b, 14);
      if (sr) tags.durSec = total / sr;
    } else if (type === 4) {
      let q = 4 + u32le(b, 0); const n = u32le(b, q); q += 4;
      for (let i = 0; i < n && q + 4 <= b.length; i++) {
        const l = u32le(b, q); q += 4;
        const kv = utf8(b.subarray(q, q + l)); q += l;
        const eq = kv.indexOf('=');
        if (eq < 0) continue;
        const k = kv.slice(0, eq).toUpperCase(), v = kv.slice(eq + 1);
        if (k === 'TITLE') tags.title = v; else if (k === 'ARTIST') tags.artist = v; else if (k === 'ALBUM') tags.album = v;
        else if (k === 'GENRE') tags.genre = v; else if (k === 'TRACKNUMBER') tags.no = parseInt(v, 10) || undefined;
        else if (k === 'DATE') tags.year = v.slice(0, 4); else if (k === 'LYRICS' || k === 'UNSYNCEDLYRICS') tags.lyrics = v;
      }
    } else if (type === 6 && !tags.picture) {
      let q = 4; const ml = u32be(b, q); q += 4;
      const mime = ascii(b, q, ml); q += ml;
      const dl = u32be(b, q); q += 4 + dl + 16;
      const n = u32be(b, q); q += 4;
      tags.picture = { mime, bytes: b.subarray(q, q + n) };
    }
    p += len;
    if (last) break;
  }
  return { tags };
}

/* ---------- MP4 / M4A ---------- */
async function parseMp4(file) {
  const tags = {}; let off = 0;
  const size = file.size;
  while (off + 8 <= size) {
    const h = await readAt(file, off, 16);
    let sz = u32be(h, 0); const type = ascii(h, 4, 4);
    if (sz === 1) sz = u32be(h, 8) * 4294967296 + u32be(h, 12);
    if (sz === 0) sz = size - off;
    if (sz < 8) break;
    if (type === 'moov' && sz < 64 * 1024 * 1024) {
      const moov = await readAt(file, off, sz);
      walkMp4(moov, 8, moov.length, tags);
      break;
    }
    off += sz;
  }
  return Object.keys(tags).length ? { tags } : null;
}
function walkMp4(u, start, end, tags) {
  let p = start;
  while (p + 8 <= end) {
    const sz = u32be(u, p), type = ascii(u, p + 4, 4);
    if (sz < 8 || p + sz > end) break;
    if (type === 'mvhd') {
      const v = u[p + 8];
      const ts = v === 1 ? u32be(u, p + 28) : u32be(u, p + 20);
      const du = v === 1 ? u32be(u, p + 36) : u32be(u, p + 24);
      if (ts) tags.durSec = du / ts;
    } else if (type === 'moov' || type === 'udta' || type === 'ilst') walkMp4(u, p + 8, p + sz, tags);
    else if (type === 'meta') walkMp4(u, p + 12, p + sz, tags);
    else if (['©nam', '©ART', '©alb', '©gen', '©day', 'covr', '©lyr', 'aART'].includes(type)) {
      // child 'data' atom: 8 header + 1 version + 3 flags + 4 reserved
      const dsz = u32be(u, p + 8);
      if (ascii(u, p + 12, 4) === 'data' && dsz >= 16) {
        const flags = (u[p + 17] << 8) | u[p + 18];
        const payload = u.subarray(p + 24, p + 8 + dsz);
        if (type === 'covr') tags.picture = tags.picture || { mime: flags === 14 ? 'image/png' : 'image/jpeg', bytes: payload };
        else {
          const v = utf8(payload);
          if (type === '©nam') tags.title = v; else if (type === '©ART') tags.artist = v; else if (type === 'aART') tags.artist = tags.artist || v;
          else if (type === '©alb') tags.album = v; else if (type === '©gen') tags.genre = v; else if (type === '©day') tags.year = v.slice(0, 4);
          else if (type === '©lyr') tags.lyrics = v;
        }
      }
    }
    p += sz;
  }
}

/* ---------- unified reader with filename fallback ---------- */
function titleFromFilename(name) {
  let base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  base = base.replace(/^\d{1,3}\s*[-.)]\s*/, '');
  const m = base.match(/^(.+?)\s+-\s+(.+)$/);
  return m ? { artist: m[1].trim(), title: m[2].trim() } : { title: base, artist: '' };
}
async function readMeta(file) {
  let res = null;
  try {
    const head = await readAt(file, 0, 16);
    if (ascii(head, 0, 3) === 'ID3') {
      const size = 10 + syncsafe(head, 6);
      res = parseID3(await readAt(file, 0, Math.min(size, 12 * 1024 * 1024)));
    } else if (ascii(head, 0, 4) === 'fLaC') {
      res = parseFlac(await readAt(file, 0, Math.min(file.size, 6 * 1024 * 1024)));
    } else if (ascii(head, 4, 4) === 'ftyp') {
      res = await parseMp4(file);
    }
  } catch (e) { console.warn('[meta]', file.name, e); }
  const tags = (res && res.tags) || {};
  const fb = titleFromFilename(file.name);
  const out = {
    title: (tags.title || fb.title || file.name).trim(), artist: (tags.artist || fb.artist || 'Unknown artist').trim(),
    album: (tags.album || '').trim(), genre: (tags.genre || '').trim(), year: tags.year, no: tags.no,
    durHint: tags.durSec || (tags.durMs ? tags.durMs / 1000 : 0), lyrics: tags.lyrics || ''
  };
  if (tags.picture && tags.picture.bytes && tags.picture.bytes.length > 100) {
    out.art = await coverToSmallDataUrl(blobUrlFromBytes(tags.picture.bytes, tags.picture.mime));
  }
  return out;
}

/* duration + proof that this browser can decode the file */
function probeAudio(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), a = new Audio();
    let done = false;
    const fin = (ok, dur) => { if (done) return; done = true; URL.revokeObjectURL(url); a.removeAttribute('src'); resolve({ ok, dur }); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => fin(true, isFinite(a.duration) ? a.duration : 0);
    a.onerror = () => fin(false, 0);
    setTimeout(() => fin(false, 0), 15000);
    a.src = url;
  });
}

/* ---------- LRC / lyrics ---------- */
function parseLyrics(text) {
  if (!text) return { synced: false, lines: [] };
  const lines = [], re = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  for (const raw of String(text).split(/\r?\n/)) {
    const stamps = [...raw.matchAll(re)];
    if (!stamps.length) continue;
    const body = raw.replace(re, '').trim();
    for (const m of stamps) {
      const frac = m[3] ? parseInt(m[3].padEnd(3, '0').slice(0, 3), 10) / 1000 : 0;
      lines.push({ t: parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + frac, text: body });
    }
  }
  if (lines.length >= 2) { lines.sort((a, b) => a.t - b.t); return { synced: true, lines }; }
  return { synced: false, lines: String(text).split(/\r?\n/).map(x => ({ t: 0, text: x.replace(/^\[[a-z]{2,}:.*\]$/i, '').trimEnd() })) };
}
function lyricsFor(t) {
  if (!t) return '';
  const u = LIB.lyrics[t.id];
  if (u !== undefined) return String(u).trim() ? u : '';   // a blank entry means "removed"
  return t.lyr || '';
}

/* ---------- local library persistence ---------- */
async function getLocalBlob(t) {
  if (SESSION_BLOBS.has(t.id)) return SESSION_BLOBS.get(t.id);
  try { return await IDB.get('files', t.id); } catch { return null; }
}
async function getOfflineBlob(id) {
  try { return await IDB.get('offline', id); } catch { return null; }
}
async function loadLocalLibrary() {
  try {
    const metas = await IDB.all('meta');
    metas.forEach(m => { if (m && m.id && !LOCAL.some(x => x.id === m.id)) { LOCAL.push(rememberTrack(m)); } });
    LOCAL.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  } catch (e) { console.warn('[local] load', e); }
}

async function importFiles(fileList, { onProgress } = {}) {
  const files = Array.from(fileList || []).filter(isAudioFile);
  const skipped = Array.from(fileList || []).length - files.length;
  const res = { added: [], dupes: 0, failed: [], skipped };
  let i = 0;
  for (const f of files) {
    i++;
    onProgress && onProgress(i, files.length, f.name);
    const id = 'lo:' + hashStr(`${f.name}|${f.size}|${f.lastModified}`).toString(36);
    if (LOCAL.some(x => x.id === id)) { res.dupes++; continue; }
    const probe = await probeAudio(f);
    if (!probe.ok) { res.failed.push(f.name); continue; }
    const meta = await readMeta(f);
    const t = {
      id, src: 'local', title: meta.title, artist: meta.artist, album: meta.album, genre: meta.genre, year: meta.year, no: meta.no,
      dur: probe.dur || meta.durHint || 0, art480: meta.art || '', art150: meta.art || '', stream: true,
      localKey: f.name, lyr: meta.lyrics || '', addedAt: Date.now(), size: f.size
    };
    let persisted = false;
    if (PREFS.rememberLocal && IDB.ok) {
      try { await IDB.put('files', id, f); await IDB.put('meta', id, t); persisted = true; }
      catch (e) { try { await IDB.del('files', id); } catch { /* ignore */ } }
    }
    if (!persisted) SESSION_BLOBS.set(id, f);
    t.session = !persisted;
    LOCAL.unshift(rememberTrack(t));
    res.added.push(t);
  }
  if (res.added.length) Bus.emit('local');
  return res;
}
async function removeLocal(id) {
  const i = LOCAL.findIndex(x => x.id === id);
  if (i >= 0) LOCAL.splice(i, 1);
  SESSION_BLOBS.delete(id);
  try { await IDB.del('files', id); await IDB.del('meta', id); } catch { /* ignore */ }
  // drop from the library too
  LIB.liked = LIB.liked.filter(x => x.t.id !== id);
  LIB.playlists.forEach(p => { p.tracks = p.tracks.filter(t => t.id !== id); });
  LIB.history = LIB.history.filter(x => x.t.id !== id);
  delete LIB.lyrics[id];
  saveLib(); Bus.emit('local'); Bus.emit('lib', 'all');
}

/* ---------- offline copies (only for tracks whose artist allows downloads) ---------- */
const Offline = {
  has(id) { return LIB.downloads.some(t => t.id === id); },
  async save(t, onProgress) {
    if (t.src === 'local') throw new Error('Local files are already on your device.');
    if (!t.dl) throw new Error('The artist has not enabled downloads for this track.');
    const { urls } = await resolveSources(t);
    let res;
    try { res = await fetch(urls[0]); } catch { throw new Error("Couldn't download — the server blocked the request or you're offline."); }
    if (!res.ok) throw new Error(`Download failed (${res.status}).`);
    let blob;
    if (res.body && onProgress && res.headers.get('content-length')) {
      const total = +res.headers.get('content-length'), rd = res.body.getReader(), parts = []; let got = 0;
      for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onProgress(got / total); }
      blob = new Blob(parts, { type: res.headers.get('content-type') || 'audio/mpeg' });
    } else blob = await res.blob();
    if (!blob.size) throw new Error('The download was empty.');
    await IDB.put('offline', t.id, blob);
    if (!Offline.has(t.id)) LIB.downloads.unshift(slim(t));
    saveLib(); Bus.emit('lib', 'downloads');
    return blob.size;
  },
  async remove(id) {
    try { await IDB.del('offline', id); } catch { /* ignore */ }
    LIB.downloads = LIB.downloads.filter(t => t.id !== id);
    saveLib(); Bus.emit('lib', 'downloads');
  }
};

/* ---- 04-lib.js ---- */
/* ==========================================================================
   SONORA — 04 library operations (likes, playlists, follows, history, stats)
   All mutations stamp updatedAt, write tombstones for deletions, save, and
   emit 'lib' so the UI can refresh. No UI code in here.
   ========================================================================== */

const Lib = {
  touch(kind) { LIB.updatedAt = now(); saveLib(); Bus.emit('lib', kind); },
  tomb(type, id) { LIB.tombstones.push({ type, id, at: now() }); if (LIB.tombstones.length > 500) LIB.tombstones.shift(); },

  /* ----- likes ----- */
  isLiked(t) { return !!t && LIB.liked.some(x => x.t.id === t.id); },
  toggleLike(t) {
    if (!t) return false;
    const i = LIB.liked.findIndex(x => x.t.id === t.id);
    if (i >= 0) { LIB.liked.splice(i, 1); this.tomb('like', t.id); this.touch('liked'); return false; }
    LIB.liked.unshift({ t: slim(t), at: now() });
    this.touch('liked');
    return true;
  },

  /* ----- playlists ----- */
  playlist(id) { return LIB.playlists.find(p => p.id === id); },
  createPlaylist({ name, desc = '', cover = '' }, tracks = []) {
    const p = {
      id: uid('pl'), name: (name || '').trim() || `My playlist #${LIB.playlists.length + 1}`, desc: desc.trim(), cover,
      tracks: uniqBy(tracks.map(slim), t => t.id), created: now(), updatedAt: now()
    };
    LIB.playlists.unshift(p);
    this.touch('playlists');
    return p;
  },
  updatePlaylist(id, patch) {
    const p = this.playlist(id); if (!p) return;
    if (patch.name !== undefined) p.name = patch.name.trim() || p.name;
    if (patch.desc !== undefined) p.desc = patch.desc.trim();
    if (patch.cover !== undefined) p.cover = patch.cover;
    p.updatedAt = now();
    this.touch('playlists');
  },
  deletePlaylist(id) {
    const i = LIB.playlists.findIndex(p => p.id === id);
    if (i < 0) return;
    LIB.playlists.splice(i, 1); this.tomb('playlist', id); this.touch('playlists');
  },
  addToPlaylist(id, tracks) {
    const p = this.playlist(id); if (!p) return { added: 0, dupes: 0 };
    const have = new Set(p.tracks.map(t => t.id));
    let added = 0, dupes = 0;
    for (const t of tracks) { if (have.has(t.id)) { dupes++; continue; } p.tracks.push(slim(t)); have.add(t.id); added++; }
    if (added) { p.updatedAt = now(); this.touch('playlists'); }
    return { added, dupes };
  },
  removeFromPlaylist(id, index) {
    const p = this.playlist(id); if (!p || index < 0 || index >= p.tracks.length) return;
    p.tracks.splice(index, 1); p.updatedAt = now(); this.touch('playlists');
  },
  moveInPlaylist(id, from, to) {
    const p = this.playlist(id); if (!p) return;
    to = clamp(to, 0, p.tracks.length - 1);
    if (from === to || from < 0 || from >= p.tracks.length) return;
    const [x] = p.tracks.splice(from, 1); p.tracks.splice(to, 0, x);
    p.updatedAt = now(); this.touch('playlists');
  },

  /* ----- saved Audius playlists / albums ----- */
  isSavedList(id) { return LIB.savedLists.some(x => x.id === id); },
  toggleSavedList(l) {
    const i = LIB.savedLists.findIndex(x => x.id === l.id);
    if (i >= 0) { LIB.savedLists.splice(i, 1); this.tomb('savedList', l.id); this.touch('saved'); return false; }
    LIB.savedLists.unshift({ ...l, at: now() }); this.touch('saved'); return true;
  },

  /* ----- followed artists ----- */
  isFollowing(id) { return LIB.followed.some(a => a.id === id); },
  toggleFollow(a) {
    const i = LIB.followed.findIndex(x => x.id === a.id);
    if (i >= 0) { LIB.followed.splice(i, 1); this.tomb('follow', a.id); this.touch('followed'); return false; }
    LIB.followed.unshift({ id: a.id, rid: a.rid, src: a.src, name: a.name, handle: a.handle, img150: a.img150, img480: a.img480, followers: a.followers, at: now() });
    this.touch('followed'); return true;
  },

  /* ----- history & stats ----- */
  pushHistory(t) {
    if (!t) return;
    const top = LIB.history[0];
    if (!(top && top.t.id === t.id && now() - top.at < 15000)) LIB.history.unshift({ t: slim(t), at: now() });
    if (LIB.history.length > 150) LIB.history.length = 150;
    this.touch('history');
  },
  clearHistory() { LIB.history = []; this.touch('history'); },
  addSeconds(sec) {
    const s = LIB.stats; s.seconds += sec;
    const k = dayKey(); s.byDay[k] = (s.byDay[k] || 0) + sec;
    const keys = Object.keys(s.byDay).sort();
    while (keys.length > 60) delete s.byDay[keys.shift()];
    // persisted by the player's periodic session save (not per tick)
  },
  countPlay(t) {
    const s = LIB.stats; s.plays++;
    if (t.artist) { const a = s.artists[t.artist] = s.artists[t.artist] || { n: 0, s: 0 }; a.n++; }
    if (t.genre) s.genres[t.genre] = (s.genres[t.genre] || 0) + 1;
    saveLib(); Bus.emit('lib', 'stats');
  },
  resetStats() { LIB.stats = LIB_DEFAULTS().stats; this.touch('stats'); },

  /* ----- searches & recently opened items ----- */
  addSearch(q) {
    q = (q || '').trim(); if (!q) return;
    LIB.searches = [q, ...LIB.searches.filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 15);
    this.touch('searches');
  },
  removeSearch(q) { LIB.searches = LIB.searches.filter(x => x !== q); this.touch('searches'); },
  clearSearches() { LIB.searches = []; LIB.recentItems = []; this.touch('searches'); },
  addRecentItem(type, data) {
    const key = `${type}:${data.id}`;
    LIB.recentItems = [{ type, data, at: now() }, ...LIB.recentItems.filter(x => `${x.type}:${x.data.id}` !== key)].slice(0, 12);
    this.touch('searches');
  },

  /* ----- lyrics ----- */
  setLyrics(id, text) { if (text) LIB.lyrics[id] = text; else delete LIB.lyrics[id]; this.touch('lyrics'); },

  /* ----- derived taste profile used for recommendations ----- */
  taste() {
    const g = {}, a = {};
    const bump = (map, key, w) => { if (key) map[key] = (map[key] || 0) + w; };
    LIB.history.slice(0, 80).forEach(x => { bump(g, x.t.genre, 1); bump(a, x.t.artistId ? `${x.t.artistId}|${x.t.artist}` : null, 1); });
    LIB.liked.slice(0, 80).forEach(x => { bump(g, x.t.genre, 2); bump(a, x.t.artistId ? `${x.t.artistId}|${x.t.artist}` : null, 2); });
    const top = m => Object.entries(m).sort((x, y) => y[1] - x[1]).map(e => e[0]);
    return { genres: top(g), artists: top(a).map(s => { const [id, ...n] = s.split('|'); return { id, name: n.join('|') }; }) };
  },

  /* ----- backup / restore (also the seed of cloud sync) ----- */
  exportJSON() {
    const copy = JSON.parse(JSON.stringify(LIB));
    return JSON.stringify({ app: 'SONORA', version: 1, exportedAt: new Date().toISOString(), prefs: { ...PREFS, jamendoId: '' }, library: copy }, null, 2);
  },
  importJSON(text) {
    let j;
    try { j = JSON.parse(text); } catch { throw new Error('That is not valid JSON.'); }
    if (!j || j.app !== 'SONORA' || !j.library) throw new Error('This file is not a SONORA backup.');
    const src = j.library;
    let n = 0;
    const mergeBy = (key, getId) => {
      const have = new Set(LIB[key].map(getId));
      arr(src[key]).forEach(x => { const id = getId(x); if (id && !have.has(id)) { LIB[key].push(x); have.add(id); n++; } });
    };
    mergeBy('liked', x => x.t && x.t.id);
    mergeBy('playlists', x => x.id);
    mergeBy('savedLists', x => x.id);
    mergeBy('followed', x => x.id);
    arr(src.searches).forEach(q => { if (!LIB.searches.includes(q)) LIB.searches.push(q); });
    Object.assign(LIB.lyrics, src.lyrics || {});
    this.touch('all');
    return n;
  }
};

/* ---- 05-player.js ---- */
/* ==========================================================================
   SONORA — 05 player: queue, audio engine (two decks for crossfade), network
   recovery, Media Session, sleep timer, equalizer, speed, session restore.
   The engine sits behind PL (public API). A native Media3 engine can replace
   E later without touching the UI (see docs/ANDROID.md).
   ========================================================================== */

const Q = { list: [], orig: [], idx: -1, ctx: null };
const PS = { playing: false, buffering: false, waiting: false, pos: 0, dur: 0, error: null };
const UNAVAIL = new Set();
const curTrack = () => Q.list[Q.idx] || null;
const isUnavail = t => !t || UNAVAIL.has(t.id) || t.stream === false;
const effVol = () => (PREFS.muted ? 0 : clamp(PREFS.volume, 0, 1));

const EQ_BANDS = [
  { f: 60, label: '60 Hz', type: 'lowshelf' }, { f: 230, label: '230 Hz', type: 'peaking' }, { f: 910, label: '910 Hz', type: 'peaking' },
  { f: 3600, label: '3.6 kHz', type: 'peaking' }, { f: 14000, label: '14 kHz', type: 'highshelf' }
];
const EQ_PRESETS = {
  flat: [0, 0, 0, 0, 0], bass: [7, 4, 0, -1, -2], vocal: [-3, -1, 3, 4, 0], treble: [-2, -1, 0, 4, 7],
  acoustic: [3, 2, 1, 2, 3], electronic: [5, 3, -1, 2, 5], lofi: [4, 2, -2, -3, -5]
};

/* ---------- navigation inside the queue ---------- */
function nextIndex(auto) {
  const n = Q.list.length;
  if (!n) return -1;
  if (auto && PREFS.repeat === 'one') return Q.idx;
  for (let k = 1; k <= n; k++) {
    let i = Q.idx + k;
    if (i >= n) { if (PREFS.repeat !== 'all') return -1; i %= n; }
    if (i === Q.idx) return isUnavail(Q.list[i]) ? -1 : i;
    if (!isUnavail(Q.list[i])) return i;
  }
  return -1;
}
function prevIndex() {
  const n = Q.list.length;
  if (!n) return -1;
  for (let k = 1; k <= n; k++) {
    let i = Q.idx - k;
    if (i < 0) { if (PREFS.repeat !== 'all') return -1; i += n; }
    if (!isUnavail(Q.list[i])) return i;
  }
  return -1;
}
function goTo(i) {
  if (i < 0 || i >= Q.list.length) return;
  Q.idx = i;
  E.load(Q.list[i], { autoplay: true });
  Bus.emit('queue');
}

/* ---------- engine ---------- */
const E = {
  decks: [], a: 0, loadId: 0, mute: false, mt: null, failStreak: 0, fading: null, cors: false,
  lastTick: 0, retryN: 0, rt: null, stallT: null, resumePos: 0, graph: null,
  get d() { return this.decks[this.a]; },
  get o() { return this.decks[1 - this.a]; },
  /* events caused by our own src/pause changes are ignored for a moment */
  quiet(fn) { this.mute = true; try { fn(); } finally { clearTimeout(this.mt); this.mt = setTimeout(() => { this.mute = false; }, 150); } },
  tryPlay(d) {
    if (this.graph && this.graph.ctx.state === 'suspended') this.graph.ctx.resume().catch(() => { });
    const p = d.el.play();
    if (p && p.catch) p.catch(err => {
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'NotAllowedError') { PS.playing = false; Bus.emit('player:state'); toast('Tap play to start playback.'); }
      else console.warn('[play]', err);
    });
  },
  setSrc(d, urls, pos, isBlob) {
    if (d.blobUrl) { URL.revokeObjectURL(d.blobUrl); d.blobUrl = null; }
    d.urls = urls; d.ci = 0;
    if (isBlob) d.blobUrl = urls[0];
    this.loadCand(d, pos);
  },
  loadCand(d, pos) {
    this.quiet(() => { d.el.src = d.urls[d.ci]; d.el.playbackRate = PREFS.speed; d.el.volume = effVol(); });
    if (pos > 0) d.el.addEventListener('loadedmetadata', () => { try { d.el.currentTime = pos; } catch { /* not seekable */ } }, { once: true });
  },
  async load(t, { pos = 0, autoplay = true } = {}) {
    const id = ++this.loadId;
    this.cancelFade();
    clearTimeout(this.rt); this.clearStall();
    const d = this.d;
    this.quiet(() => d.el.pause());
    d.track = t; d.started = false; d.counted = false; d.listened = 0;
    PS.error = null; PS.pos = pos; PS.dur = t.dur || 0; PS.buffering = true; PS.waiting = false; PS.playing = !!autoplay;
    this.lastTick = 0; this.retryN = 0;
    Bus.emit('player:track'); Bus.emit('player:state'); MS.meta(); MS.state();
    let src;
    try { src = await resolveSources(t); } catch (e) {
      if (id !== this.loadId) return;
      failTrack(t, errMsg(e), true); return;
    }
    if (id !== this.loadId) { if (src.blob) URL.revokeObjectURL(src.urls[0]); return; }
    this.setSrc(d, src.urls, pos, src.blob);
    if (autoplay) this.tryPlay(d);
  },
  seek(sec) {
    const d = this.d; if (!d.el.src) return;
    const dur = isFinite(d.el.duration) ? d.el.duration : PS.dur;
    sec = clamp(sec, 0, dur || sec);
    try { d.el.currentTime = sec; } catch { return; }
    PS.pos = sec; this.lastTick = 0; Bus.emit('player:time'); MS.position();
  },
  /* ----- recovery ----- */
  stallWatch() {
    if (this.stallT || !PS.playing) return;
    this.stallT = setTimeout(() => { this.stallT = null; if (PS.playing && PS.buffering) this.waitNet(this.d); }, 10000);
  },
  clearStall() { clearTimeout(this.stallT); this.stallT = null; },
  waitNet(d) {
    PS.waiting = true; PS.buffering = true;
    this.resumePos = Math.max(PS.pos, d.el.currentTime || 0);
    Bus.emit('player:state');
    this.scheduleRetry();
  },
  scheduleRetry() {
    clearTimeout(this.rt);
    const delays = [2000, 4000, 8000, 15000, 30000];
    if (this.retryN >= delays.length) { PS.waiting = false; failTrack(curTrack(), 'Connection problem. Playback paused; tap play to try again.', false); return; }
    this.rt = setTimeout(() => this.retryNow(), delays[this.retryN++]);
  },
  retryNow() {
    clearTimeout(this.rt);
    const d = this.d;
    if (!d.track || !PS.waiting) return;
    if (!navigator.onLine) { this.scheduleRetry(); return; }
    this.loadCand(d, this.resumePos);
    if (PS.playing) this.tryPlay(d);
  },
  /* ----- crossfade ----- */
  cancelFade() {
    const F = this.fading; if (!F) return;
    clearInterval(F.iv); this.fading = null;
    this.quiet(() => { F.o.el.pause(); F.o.el.removeAttribute('src'); F.o.el.load(); });
    if (F.o.blobUrl) { URL.revokeObjectURL(F.o.blobUrl); F.o.blobUrl = null; }
    applyVolume();
  },
  /* ----- equalizer ----- */
  ensureGraph() {
    if (this.graph) return this.graph;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Web Audio is not supported in this browser.');
    const ctx = new AC(), input = ctx.createGain();
    let prev = input;
    const filters = EQ_BANDS.map((b, i) => {
      const f = ctx.createBiquadFilter();
      f.type = b.type; f.frequency.value = b.f; if (b.type === 'peaking') f.Q.value = 1;
      f.gain.value = PREFS.eq.gains[i] || 0;
      prev.connect(f); prev = f; return f;
    });
    prev.connect(ctx.destination);
    return (this.graph = { ctx, input, filters });
  },
  setEqGains(gains) { if (!this.graph) return; this.graph.filters.forEach((f, i) => { f.gain.value = gains[i] || 0; }); },
  async enableEQ() {
    try { this.ensureGraph(); await this.graph.ctx.resume(); } catch (e) { toast(errMsg(e), { kind: 'warn' }); return false; }
    this.rebuild(true); return true;
  },
  disableEQ() { this.rebuild(false); },
  rebuild(cors) {
    const t = this.d && this.d.track, pos = PS.pos, was = PS.playing;
    this.cancelFade();
    this.decks.forEach(destroyDeck);
    this.decks = [mkDeck(cors), mkDeck(cors)]; this.a = 0; this.cors = cors;
    if (cors) this.decks.forEach(d => { d.node = this.graph.ctx.createMediaElementSource(d.el); d.node.connect(this.graph.input); });
    applyVolume();
    if (t) { this.d.track = t; if (PS.playing || pos > 0 || PS.dur) this.load(t, { pos, autoplay: was }); }
  }
};

function destroyDeck(d) {
  if (!d) return;
  E.quiet(() => { try { d.el.pause(); d.el.removeAttribute('src'); d.el.load(); } catch { /* ignore */ } });
  if (d.blobUrl) { URL.revokeObjectURL(d.blobUrl); d.blobUrl = null; }
  try { d.node && d.node.disconnect(); } catch { /* ignore */ }
  d.dead = true;
}

function mkDeck(cors) {
  const el = new Audio();
  el.preload = 'auto'; el.setAttribute('playsinline', '');
  if ('preservesPitch' in el) el.preservesPitch = true;
  if (cors) el.crossOrigin = 'anonymous';
  const d = { el, track: null, urls: [], ci: 0, blobUrl: null, cors: !!cors, started: false, counted: false, listened: 0, node: null, dead: false };
  const act = fn => e => { if (!d.dead && E.d === d) fn(e); };
  el.addEventListener('loadstart', act(() => { PS.buffering = true; Bus.emit('player:state'); }));
  el.addEventListener('waiting', act(() => { E.lastTick = 0; PS.buffering = true; E.stallWatch(); Bus.emit('player:state'); }));
  el.addEventListener('stalled', act(() => { E.stallWatch(); }));
  el.addEventListener('seeking', act(() => { E.lastTick = 0; }));
  el.addEventListener('canplay', act(() => { PS.buffering = false; Bus.emit('player:state'); }));
  el.addEventListener('playing', act(() => {
    PS.buffering = false; PS.waiting = false; PS.error = null; E.failStreak = 0; E.clearStall(); E.retryN = 0;
    onStarted(d); MS.state(); Bus.emit('player:state');
  }));
  el.addEventListener('play', act(() => { if (!PS.playing) { PS.playing = true; MS.state(); Bus.emit('player:state'); } }));
  el.addEventListener('pause', act(() => {
    E.lastTick = 0;
    if (E.mute || el.ended || E.fading) return;
    if (PS.playing) { PS.playing = false; MS.state(); Bus.emit('player:state'); }   // paused by the system (audio focus, headset, call)
  }));
  el.addEventListener('timeupdate', act(() => onTime(d)));
  el.addEventListener('durationchange', act(() => {
    if (isFinite(el.duration) && el.duration > 0) { PS.dur = el.duration; Bus.emit('player:time'); MS.position(); }
  }));
  el.addEventListener('ended', act(() => onEnded()));
  el.addEventListener('error', act(() => onDeckError(d)));
  return d;
}

function onStarted(d) {
  if (d.started || !d.track) return;
  d.started = true;
  Lib.pushHistory(d.track);
  Bus.emit('player:started', d.track);
}

function saveSessionNow() {
  const t = curTrack(); if (!t) return;
  const start = Math.max(0, Math.min(Q.idx - 20, Q.list.length - 100));
  LS.set('session', { list: Q.list.slice(start, start + 100).map(slim), idx: Q.idx - start, pos: PS.pos, ctx: Q.ctx, shuffled: Q.orig.length > 0 });
  saveLibNow();
}
const saveSession = throttle(saveSessionNow, 5000);           // periodic while playing
// Always persist the exact position when the page is hidden or closed, so a restart resumes where you stopped.
addEventListener('pagehide', saveSessionNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveSessionNow(); });

function onTime(d) {
  const t = d.track, cur = d.el.currentTime, n = performance.now();
  PS.pos = cur;
  if (PS.playing && E.lastTick) {
    const dt = (n - E.lastTick) / 1000;
    if (dt > 0 && dt < 2) {
      Lib.addSeconds(dt); d.listened += dt;
      if (!d.counted && t && (d.listened >= 30 || (PS.dur > 0 && PS.dur < 60 && d.listened >= PS.dur * 0.5))) { d.counted = true; Lib.countPlay(t); }
    }
  }
  E.lastTick = n;
  Bus.emit('player:time');
  maybeCrossfade();
  saveSession();
  if (Math.floor(cur) % 15 === 0) MS.position();
}

function onEnded() {
  if (E.fading) { finishFade(); return; }
  if (Sleep.mode === 'track') { Sleep.cancel(); PS.playing = false; Bus.emit('player:state'); toast('Sleep timer: playback stopped.'); return; }
  if (PREFS.repeat === 'one') { E.d.el.currentTime = 0; E.tryPlay(E.d); return; }
  const ni = nextIndex(true);
  if (ni < 0) { PS.playing = false; PS.pos = 0; MS.state(); Bus.emit('player:state'); Bus.emit('player:time'); return; }
  goTo(ni);
}

function onDeckError(d) {
  if (!d.el.getAttribute('src')) return;
  const code = d.el.error && d.el.error.code, t = d.track;
  if (!t) return;
  if (!navigator.onLine || code === 2) { E.waitNet(d); return; }
  if (d.ci + 1 < d.urls.length) { d.ci++; E.loadCand(d, PS.pos); if (PS.playing) E.tryPlay(d); return; }
  if (d.cors && t.src !== 'local') {
    // The server does not allow audio processing (CORS). Fall back to plain playback and turn the equalizer off.
    PREFS.eq.on = false; setPref('eq', PREFS.eq); E.disableEQ(); Bus.emit('eq');
    toast('The equalizer needs audio sources that allow processing. This one doesn’t, so it was switched off.', { kind: 'warn', ms: 6000 });
    return;
  }
  failTrack(t, code === 3 ? 'This audio file is damaged or in a format your browser can’t decode.' : 'This track is unavailable right now.', true);
}

function failTrack(t, msg, permanent) {
  PS.error = msg; PS.playing = false; PS.buffering = false; PS.waiting = false;
  if (permanent && t) UNAVAIL.add(t.id);
  E.failStreak++;
  MS.state(); Bus.emit('player:state'); Bus.emit('player:error', t, msg); Bus.emit('queue');
  const ni = nextIndex(false), hasNext = ni >= 0 && ni !== Q.idx;
  if (permanent && PREFS.autoSkip && hasNext && E.failStreak < 3) {
    toast(`${msg} Skipping to the next track.`, { kind: 'warn' });
    setTimeout(() => { if (curTrack() === t && PS.error) goTo(nextIndex(false)); }, 1100);
  } else {
    toast(E.failStreak >= 3 ? 'Several tracks in a row failed, so playback stopped.' : msg, { kind: 'warn', action: hasNext ? { label: 'Skip', fn: () => PL.next() } : null });
  }
}

/* ---------- crossfade ---------- */
function maybeCrossfade() {
  const cf = PREFS.crossfade;
  if (!cf || PREFS.dataSaver || E.fading || !PS.playing) return;
  const el = E.d.el;
  if (!isFinite(el.duration) || el.duration < cf * 3 || el.duration - el.currentTime > cf) return;
  if (PREFS.repeat === 'one' || Sleep.mode === 'track') return;
  const ni = nextIndex(true);
  if (ni < 0 || ni === Q.idx) return;
  startFade(ni, cf);
}
async function startFade(ni, secs) {
  const t = Q.list[ni], o = E.o, F = (E.fading = { ni, t, o, d: E.d, iv: null });
  let src;
  try { src = await resolveSources(t); } catch { if (E.fading === F) E.fading = null; return; }
  if (E.fading !== F) { if (src.blob) URL.revokeObjectURL(src.urls[0]); return; }
  o.track = t; o.started = false; o.counted = false; o.listened = 0;
  if (o.blobUrl) URL.revokeObjectURL(o.blobUrl);
  o.blobUrl = src.blob ? src.urls[0] : null; o.urls = src.urls; o.ci = 0;
  E.quiet(() => { o.el.src = src.urls[0]; o.el.volume = 0; o.el.playbackRate = PREFS.speed; });
  try { await o.el.play(); } catch { if (E.fading === F) E.cancelFade(); return; }
  if (E.fading !== F) return;
  const vol = effVol(), t0 = performance.now();
  F.iv = setInterval(() => {
    const x = clamp((performance.now() - t0) / (secs * 1000), 0, 1);
    F.d.el.volume = vol * Math.cos(x * Math.PI / 2);
    o.el.volume = vol * Math.sin(x * Math.PI / 2);
    if (x >= 1) finishFade();
  }, 80);
}
function finishFade() {
  const F = E.fading; if (!F) return;
  clearInterval(F.iv); E.fading = null;
  const old = F.d;
  E.quiet(() => { old.el.pause(); old.el.removeAttribute('src'); old.el.load(); });
  if (old.blobUrl) { URL.revokeObjectURL(old.blobUrl); old.blobUrl = null; }
  E.a = 1 - E.a;
  Q.idx = F.ni;
  PS.pos = E.d.el.currentTime; PS.dur = isFinite(E.d.el.duration) ? E.d.el.duration : (F.t.dur || 0);
  PS.error = null; E.lastTick = 0;
  applyVolume(); onStarted(E.d);
  Bus.emit('player:track'); Bus.emit('player:state'); Bus.emit('queue'); MS.meta(); MS.state();
}

/* ---------- volume ---------- */
function applyVolume() {
  if (E.fading || Sleep.fadeIv) return;
  E.decks.forEach(d => { d.el.volume = effVol(); });
}

/* ---------- sleep timer ---------- */
const Sleep = {
  mode: null, endAt: 0, timer: null, fadeIv: null,
  set(m) {
    this.cancel();
    if (m === 'track') this.mode = 'track';
    else { this.mode = 'time'; this.endAt = now() + m * 60000; this.timer = setInterval(() => this.tick(), 1000); }
    Bus.emit('sleep');
  },
  remaining() { return this.mode === 'time' ? Math.max(0, this.endAt - now()) : 0; },
  tick() {
    if (this.remaining() <= 0) this.fadeOut();
    Bus.emit('sleep:tick');
  },
  fadeOut() {
    clearInterval(this.timer); this.timer = null;
    const start = effVol(); let k = 0;
    this.fadeIv = setInterval(() => {
      k++; E.decks.forEach(d => { d.el.volume = start * Math.max(0, 1 - k / 20); });
      if (k >= 20) {
        clearInterval(this.fadeIv); this.fadeIv = null; this.mode = null;
        PL.pause(); applyVolume(); Bus.emit('sleep'); toast('Sleep timer finished. Playback stopped.');
      }
    }, 200);
  },
  cancel() {
    clearInterval(this.timer); this.timer = null;
    if (this.fadeIv) { clearInterval(this.fadeIv); this.fadeIv = null; applyVolume(); }
    const was = this.mode; this.mode = null; this.endAt = 0;
    if (was) Bus.emit('sleep');
  }
};

/* ---------- Media Session (lock-screen / notification controls where supported) ---------- */
const MS = {
  ok: 'mediaSession' in navigator,
  init() {
    if (!this.ok) return;
    const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch { /* unsupported action */ } };
    h('play', () => PL.resumePlayback());
    h('pause', () => PL.pause());
    h('previoustrack', () => PL.prev());
    h('nexttrack', () => PL.next());
    h('seekto', e => { if (e.seekTime != null) PL.seek(e.seekTime); });
    h('seekbackward', e => PL.seekRel(-(e.seekOffset || 10)));
    h('seekforward', e => PL.seekRel(e.seekOffset || 10));
    h('stop', () => PL.pause());
  },
  meta() {
    const t = curTrack(); if (!this.ok || !t) return;
    const art = artUrl(t, 'lg');
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, album: t.album || (t.src === 'audius' ? 'Audius' : t.src === 'jamendo' ? 'Jamendo' : ''),
        artwork: art ? [{ src: art, sizes: '512x512' }] : []
      });
    } catch { /* ignore */ }
  },
  state() { if (this.ok) { try { navigator.mediaSession.playbackState = curTrack() ? (PS.playing ? 'playing' : 'paused') : 'none'; } catch { /* ignore */ } } },
  position() {
    if (!this.ok || !PS.dur || !isFinite(PS.dur)) return;
    try { navigator.mediaSession.setPositionState({ duration: PS.dur, position: clamp(PS.pos, 0, PS.dur), playbackRate: PREFS.speed }); } catch { /* ignore */ }
  }
};

/* ---------- public player API ---------- */
const PL = {
  init() {
    E.decks = [mkDeck(false), mkDeck(false)];
    // the equalizer setting is remembered: rebuild the engine with the audio graph so the UI never claims EQ is on when it isn't
    if (PREFS.eq.on) { try { E.ensureGraph(); E.rebuild(true); } catch { PREFS.eq.on = false; setPref('eq', PREFS.eq); } }
    applyVolume(); MS.init();
    addEventListener('online', () => { NET.online = true; setNet('ok'); if (PS.waiting) E.retryNow(); Bus.emit('net'); });
    addEventListener('offline', () => { NET.online = false; setNet('offline'); });

  get track() { return curTrack(); },

  play(list, idx = 0, ctx = null, opts = {}) {
    list = arr(list).filter(Boolean);

    if (opts.shuffle) { PREFS.shuffle = true; setPref('shuffle', true); const ok = list.map((t, k) => k).filter(k => !isUnavail(list[k])); i = ok.length ? ok[Math.floor(Math.random() * ok.length)] : 0; }

  playTrack(t, ctx) { this.play([t], 0, ctx || { type: 'track', name: t.title }); },
  applyShuffle() {

  cycleRepeat() {

  toggle() { if (!curTrack()) return; if (PS.playing) this.pause(); else this.resumePlayback(); },
  pause() {

  },
  resumePlayback() {
    const t = curTrack(); if (!t) return;
    const d = E.d;

    if (PS.error || !d.el.getAttribute('src') || d.track !== t) { E.failStreak = 0; UNAVAIL.delete(t.id); E.load(t, { pos: PS.error ? PS.pos : (PS.pos || 0), autoplay: true }); return; }

  next() {

  },
  prev() {

  seek(s) { E.seek(s); },
  seekRel(d) { E.seek(PS.pos + d); },
  setVolume(v) { setPref('volume', clamp(v, 0, 1)); if (v > 0 && PREFS.muted) setPref('muted', false); applyVolume(); Bus.emit('player:state'); },
  toggleMute() { setPref('muted', !PREFS.muted); applyVolume(); Bus.emit('player:state'); },
  setSpeed(s) { setPref('speed', s); E.decks.forEach(d => { d.el.playbackRate = s; }); MS.position(); Bus.emit('player:state'); },

  /* ----- queue editing ----- */
  addNext(t) {
    if (!curTrack()) { this.playTrack(t); return; }

  addToQueue(t) {

  upcomingCount() { return Math.max(0, Q.list.length - Q.idx - 1); }
};

/* ---------- overlay / back stack (Android back button, Esc, history) ---------- */
const UI_STACK = [];
/* History is kept in step with UI_STACK through a small serial queue. history.go() is asynchronous, so a
   close-then-open (menu item that closes its sheet and opens another) must not interleave pushState with a
   pending go(-1); that used to leave the history one entry short and the next "back" left the app.
   Each go() waits for its popstate; depth is clamped so we never go back past the app's own entries. */
const H = { depth: 0, q: [], busy: false, timer: null, ok: true };
function hRun() {
  if (H.busy) return;
  const op = H.q.shift(); if (!op) return;
  if (!H.ok) { hRun(); return; }
  if (op.t === 'push') { try { history.pushState({ sn: 1 }, ''); H.depth++; } catch { H.ok = false; } hRun(); return; }
  const n = Math.max(op.n, -H.depth);
  if (!n) { hRun(); return; }
  H.busy = true; H.depth += n;
  H.timer = setTimeout(hDone, 800);              // popstate never arrived: carry on anyway
  try { history.go(n); } catch { hDone(); }
}
function hDone() { clearTimeout(H.timer); H.busy = false; hRun(); }
function histPush() { H.q.push({ t: 'push' }); hRun(); }
function histGo(n) { if (n) { H.q.push({ t: 'go', n }); hRun(); } }
function pushUI(item) { UI_STACK.push(item); histPush(); syncViews(); return item; }
function popTop(fromHistory) {
  const it = UI_STACK.pop();
  if (!it) return false;
  try { it.close(); } catch (e) { console.error(e); }
  if (!fromHistory) histGo(-1);
  syncViews();
  return true;
}

  const n = UI_STACK.length;

  if (n) histGo(-n);

}
function unwindToView() {            // close sheets / Now Playing, keep pushed views

}
addEventListener('popstate', () => {
  if (H.busy) { hDone(); return; }               // the traversal we asked for
  H.depth = Math.max(0, H.depth - 1);            // the user (or Android back) went back one entry
  popTop(true);
});

/* ---------- views: persistent tab containers + pushed detail views ---------- */
const NAVS = { tab: 'home', built: {}, dirty: {} };

function tabEl(name) { return $('#tab-' + name); }

    }

async function fillShelf(root, id, loader, render, opts = {}) {

/* ---------- drag-to-reorder (pointer events, touch friendly) ---------- */
function makeSortable(container, onMove, rowSel = '.row') {
  container.addEventListener('pointerdown', e => {
    const grip = e.target.closest('[data-grip]');
    if (!grip) return;
    const row = grip.closest(rowSel);
    if (!row) return;
    e.preventDefault();
    const rows = Array.from(container.querySelectorAll(rowSel)), from = rows.indexOf(row);
    const rects = rows.map(r => r.getBoundingClientRect()), startY = e.clientY;
    let to = from;
    row.classList.add('dragging'); container.classList.add('is-dragging');
    try { grip.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    const mv = ev => {
      const dy = ev.clientY - startY;
      row.style.transform = `translateY(${dy}px)`;
      const center = rects[from].top + rects[from].height / 2 + dy;
      to = rects.findIndex(r => center < r.top + r.height);
      if (to < 0) to = rects.length - 1;
      rows.forEach((r, i) => {
        if (i === from) return;
        let sh = 0;
        if (from < to && i > from && i <= to) sh = -rects[from].height;
        if (from > to && i >= to && i < from) sh = rects[from].height;
        r.style.transform = sh ? `translateY(${sh}px)` : '';
      });
    };
    const up = () => {
      grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      rows.forEach(r => { r.style.transform = ''; });
      row.classList.remove('dragging');
      setTimeout(() => container.classList.remove('is-dragging'), 0);
      if (to !== from) onMove(from, to);
    };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}

/* ---------- action dispatcher ---------- */
const ACT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.closest('.is-dragging')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) { console.warn('[ui] no handler for', el.dataset.act); return; }
  e.preventDefault();
  if (el.hasAttribute('data-close')) closeTopSheet();
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast(errMsg(err), { kind: 'warn' }); });
});

/* deterministic shuffle so "Daily Mix" is stable through a day */
function seededShuffle(list, seed) {
  let s = hashStr(seed) || 1;
  const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---------- shared loaders ---------- */
const trendWeek = () => Audius.trending({ time: 'week', limit: 50 });
function artistsFromTracks(tracks) {
  const m = new Map();
  tracks.forEach(t => {
    if (!t.artistId) return;
    const a = m.get(t.artistId) || { id: t.artistId, rid: String(t.artistId).slice(3), src: t.src, name: t.artist, handle: t.handle, img480: t.uimg || '', img150: t.uimg150 || '', followers: t.ufol || 0, plays: 0 };
    a.plays += t.plays || 0; m.set(t.artistId, a);
  });
  return [...m.values()].sort((a, b) => b.plays - a.plays);
}
async function loadAlbums(kind = 'album') {
  let out = [], err = null;
  try { out = (await Audius.trendingLists({ type: kind })).filter(x => x.kind === kind); } catch (e) { err = e; }
  if (!out.length) { try { out = (await Audius.searchLists(kind)).filter(x => x.kind === kind); } catch (e) { err = err || e; } }
  if (!out.length && err) throw err;
  return out;
}
async function loadRecommended() {
  const taste = Lib.taste(), heard = new Set([...LIB.history.map(x => x.t.id), ...LIB.liked.map(x => x.t.id)]);
  const genres = taste.genres.filter(g => AUDIUS_GENRES.includes(g)).slice(0, 2);
  const artists = taste.artists.filter(a => a.id && a.id.startsWith('au:')).slice(0, 2);
  const personal = genres.length + artists.length > 0;
  const jobs = personal
    ? [...genres.map(g => Audius.trending({ genre: g, time: 'month', limit: 30 })), ...artists.map(a => Audius.userTracks(a.id.slice(3), { limit: 15 }))]
    : [Audius.trending({ time: 'month', limit: 40 })];
  const res = await Promise.allSettled(jobs);
  const ok = res.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!ok.length) throw res[0].reason;
  const tracks = interleave(...ok).filter(t => t.stream !== false && (!personal || !heard.has(t.id))).slice(0, 20);
  REC_META = { personal, genres, artists };
  return tracks;
}
let REC_META = { personal: false, genres: [], artists: [] };
async function loadMixes() {
  const taste = Lib.taste();
  let gs = taste.genres.filter(g => AUDIUS_GENRES.includes(g)).slice(0, 3);
  const personal = gs.length > 0;
  for (const d of ['Electronic', 'Hip-Hop/Rap', 'Pop', 'Lo-Fi', 'Rock']) if (gs.length < 3 && !gs.includes(d)) gs.push(d);
  gs = gs.slice(0, 3);
  const res = await Promise.allSettled(gs.map(g => Audius.trending({ genre: g, time: 'month', limit: 30 })));
  const mixes = res.map((r, i) => (r.status === 'fulfilled' && r.value.length >= 5)
    ? rememberEnt({ id: 'mix:' + slug(gs[i]), kind: 'mix', name: `Daily Mix ${i + 1}`, desc: gs[i], genre: gs[i], tracks: seededShuffle(r.value, dayKey() + gs[i]).slice(0, 25), gen: true, personal })
    : null).filter(Boolean);
  if (!mixes.length && res.every(r => r.status === 'rejected')) throw res[0].reason;
  return mixes;
}

  if (def.t === 'trend') {
    tracks = await Audius.trending({ time: 'week', limit: PAGE, offset }); more = tracks.length === PAGE;
  } else if (def.t === 'new') {
    tracks = (await trendWeek()).filter(t => t.rel).sort((a, b) => String(b.rel).localeCompare(String(a.rel)));
  } else if (def.t === 'genre' || def.t === 'lang') {
    if (def.g) {
      tracks = await Audius.trending({ genre: def.g, time: 'month', limit: PAGE, offset });
      if (!offset && tracks.length < 8) tracks = interleave(tracks, await Audius.trending({ genre: def.g, time: 'allTime', limit: PAGE }));
      more = tracks.length >= PAGE;
    } else {
      tracks = await Audius.searchTracks(def.q, { limit: PAGE, offset }); more = tracks.length === PAGE;
    }
    if (jam && !offset) {
      const extra = def.t === 'lang' ? (def.jl ? await Jamendo.tracks({ lang: def.jl, order: 'popularity_week', limit: 15 }).catch(() => []) : [])
        : await Jamendo.tracks({ tags: def.jt || def.id, order: 'popularity_week', limit: 15 }).catch(() => []);
      tracks = interleave(tracks, extra);
    }
  } else if (def.t === 'query') {
    let a = [];
    if (def.mood) a = await Audius.searchTracks(def.q, { limit: PAGE, offset, mood: def.mood }).catch(() => []);
    const b = a.length < 8 ? await Audius.searchTracks(def.q, { limit: PAGE, offset }) : [];
    tracks = interleave(a, b); more = tracks.length >= PAGE;
    if (jam && !offset && def.jt) tracks = interleave(tracks, await Jamendo.tracks({ tags: def.jt, order: 'popularity_week', limit: 15 }).catch(() => []));
  }
  return { tracks, more };
}
function categoryNote(def) {

  if (def.t === 'query') return `Keyword search on Audius for “${def.q}”${def.mood ? ` plus the ${def.mood.join(' / ')} mood tags` : ''}. Not a complete catalogue.`;

}
function buildCategory(el, { cat }) {
  const def = CATS.get(cat);
  if (!def) { el.innerHTML = topbar({ back: true }) + emptyState({ icon: 'info', title: 'Unknown category' }); return; }
  let offset = 0, all = [];
  const head = `${topbar({ back: true, title: def.name })}
    <div class="pad"><div class="cat-hero">${catArt(cat, def.name, def.hue)}</div>
    <p class="muted cat-note">${esc(def.desc || '')} ${esc(categoryNote(def))}</p><div id="cat-body"></div></div>`;
  el.innerHTML = head;
  const body = $('#cat-body', el);
  const draw = (more) => {
    const ctx = { type: 'category', name: def.name };
    const key = regList(all, ctx);
    body.innerHTML = `<div class="action-row">
        <button type="button" class="btn primary" data-act="playAll" data-list="${key}">${ic('play')} Play</button>
        <button type="button" class="btn ghost" data-act="shuffleAll" data-list="${key}">${ic('shuffle')} Shuffle</button></div>
      <div class="rows" data-list="${key}">${all.map((t, i) => trackRow(t, { list: key, i })).join('')}</div>
      ${more ? `<div class="center"><button type="button" class="btn ghost" id="cat-more">Load more</button></div>` : ''}`;
    const mb = $('#cat-more', body);
    if (mb) mb.addEventListener('click', () => { mb.disabled = true; mb.textContent = 'Loading…'; load(); });
  };
  const load = async () => {
    try {
      if (def.t === 'artists') {
        const arts = artistsFromTracks(await trendWeek());
        body.innerHTML = arts.length ? `<div class="grid-cards">${arts.map(artistCard).join('')}</div>` : emptyState({ icon: 'user', title: 'No artists returned', text: 'Audius returned no trending tracks right now.' });
        return;
      }
      if (def.t === 'albums') {
        const l = await loadAlbums('album');
        body.innerHTML = l.length ? `<div class="grid-cards">${l.map(listCard).join('')}</div>` : emptyState({ icon: 'disc', title: 'No albums returned', text: 'Audius returned no albums right now.' });
        return;
      }
      if (!offset) body.innerHTML = skelRows(8);
      const r = await loadCategory(def, offset);
      if (!el.isConnected) return;
      all = uniqBy(all.concat(r.tracks), t => t.id); offset += PAGE;
      if (!all.length) { body.innerHTML = emptyState({ icon: 'music', title: 'Nothing found', text: 'The connected music services returned no tracks for this category. Try another one, or search for a specific artist.' }); return; }

  load();
}

const SS = { q: '', tab: 'all', seq: 0, abort: null, loading: false, results: null };
const SEARCH_TABS = [['all', 'All'], ['songs', 'Songs'], ['artists', 'Artists'], ['albums', 'Albums'], ['playlists', 'Playlists'], ['genres', 'Genres'], ['library', 'Your library']];

function libraryMatches(q) {
  const s = q.toLowerCase(), has = t => `${t.title} ${t.artist} ${t.album || ''}`.toLowerCase().includes(s);
  const tracks = uniqBy([...LOCAL, ...LIB.liked.map(x => x.t), ...LIB.downloads, ...LIB.history.map(x => x.t), ...LIB.playlists.flatMap(p => p.tracks)].filter(has), t => t.id);
  return {
    tracks,
    playlists: LIB.playlists.filter(p => p.name.toLowerCase().includes(s)),
    artists: LIB.followed.filter(a => a.name.toLowerCase().includes(s))
  };
}
function browseMatches(q) {
  const s = q.toLowerCase();
  return [...GENRE_DEFS.map(d => ['genre:' + d.id, d]), ...LANG_DEFS.map(d => ['lang:' + d.id, d]), ...CAT_DEFS.filter(d => d.t === 'query').map(d => ['cat:' + d.id, d])]
    .filter(([, d]) => d.name.toLowerCase().includes(s) || (d.g || '').toLowerCase().includes(s));
}

function buildSearch(el) {
  el.innerHTML = `
    ${topbar({ title: 'Search' })}
    <div class="searchbar"><div class="search-field">${ic('search')}
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Songs, artists, albums, playlists" aria-label="Search" value="${esc(SS.q)}">
      <button class="icon-btn" id="search-clear" type="button" data-act="searchClear" aria-label="Clear search" ${SS.q ? '' : 'hidden'}>${ic('x')}</button></div></div>
    <div class="pad" id="search-body"></div>`;
  const input = $('#search-input', el);
  const run = debounce(q => runSearch(q), 300);
  input.addEventListener('input', () => {
    SS.q = input.value.trim();
    $('#search-clear', el).hidden = !SS.q;
    if (!SS.q) { run.cancel(); if (SS.abort) SS.abort.abort(); SS.seq++; SS.loading = false; SS.results = null; renderSearchBody(); return; }
    SS.loading = true; renderSearchBody(); run(SS.q);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run.cancel(); if (SS.q) { Lib.addSearch(SS.q); runSearch(SS.q); } input.blur(); } });
  watch(el, 'lib', k => { if (k === 'searches' && !SS.q) renderSearchBody(); });
  renderSearchBody();

}
async function runSearch(q) {
  const seq = ++SS.seq;

  SS.abort = new AbortController(); SS.loading = true; renderSearchBody();
  const res = await searchAll(q, { signal: SS.abort.signal });
  if (seq !== SS.seq) return;
  SS.loading = false; SS.results = { q, ...res }; renderSearchBody();
}
function setSearch(q, commit) {
  SS.q = q;
  const input = $('#search-input'); if (input) { input.value = q; $('#search-clear').hidden = !q; }
  if (commit && q) Lib.addSearch(q);
  if (q) { SS.results = null; runSearch(q); } else { SS.results = null; SS.loading = false; renderSearchBody(); }
}

function renderSearchBody() {

  const q = SS.q;
  if (!q) { body.innerHTML = searchIdleHtml(); loadTrendingSearches(); return; }
  const lib = libraryMatches(q), br = browseMatches(q), R = SS.results && SS.results.q === q ? SS.results : null;
  const tabs = `<div class="chips" role="tablist">${SEARCH_TABS.map(([k, l]) => `<button type="button" role="tab" class="chip ${SS.tab === k ? 'on' : ''}" data-act="searchTab" data-tab="${k}" aria-selected="${SS.tab === k}">${l}</button>`).join('')}</div>`;
  const hist = LIB.searches.filter(h => h.toLowerCase().includes(q.toLowerCase()) && h.toLowerCase() !== q.toLowerCase()).slice(0, 3);
  const sugg = hist.length ? `<div class="sugg">${hist.map(h => `<button type="button" class="sugg-item" data-act="searchSet" data-q="${esc(h)}">${ic('clock')}<span>${esc(h)}</span></button>`).join('')}</div>` : '';

  const albums = lists.filter(l => l.kind === 'album'), plays = lists.filter(l => l.kind === 'playlist');
  const sectionRows = (title, list, ctxName, limit, tab) => {

    const shown = limit ? list.slice(0, limit) : list;
    const key = regList(list, { type: 'search', name: `Search: ${q}` });

  };
  const shelfOf = (title, items, fn, tab, limit = 10) => items.length ? `<section class="sec">${sectionHead(title, '', items.length > 4 && SS.tab === 'all' ? `<button type="button" class="link-btn" data-act="searchTab" data-tab="${tab}">See all</button>` : '')}

  const genreTiles = br.length ? `<section class="sec">${sectionHead('Genres and categories')}<div class="tiles small">${br.slice(0, SS.tab === 'all' ? 6 : 30).map(([key, d]) => `<button type="button" class="tile" data-act="openCat" data-cat="${key}">${catArt(key, d.name, d.hue)}</button>`).join('')}</div></section>` : '';
  const libHtml = (lib.tracks.length || lib.playlists.length || lib.artists.length) ? `<section class="sec">${sectionHead('In your library')}

      ${lib.tracks.length ? (() => { const k = regList(lib.tracks, { type: 'search', name: 'Your library' }); return `<div class="rows" data-list="${k}">${lib.tracks.slice(0, SS.tab === 'all' ? 4 : 100).map((t, i) => trackRow(t, { list: k, i })).join('')}</div>`; })() : ''}</section>` : '';
  const loadingBlock = SS.loading ? `<div class="loading-line" role="status">${ic('refresh', 'spin')} Searching${providerCount() > 1 ? ' all sources' : ' Audius'}…</div>${SS.tab === 'all' || SS.tab === 'songs' ? skelRows(4) : ''}` : '';
  const T = SS.tab;
  if (T === 'all') html += sectionRows('Songs', tracks, 'Songs', 5, 'songs') + shelfOf('Artists', artists, artistCard, 'artists') + shelfOf('Albums', albums, listCard, 'albums') + shelfOf('Playlists', plays, listCard, 'playlists') + genreTiles + libHtml;
  else if (T === 'songs') html += sectionRows('Songs', tracks, 'Songs', 0, 'songs');

  }

  } else if (tab === 'recent') {
    const list = uniqBy(LIB.history.map(x => x.t), t => t.id).filter(t => hit(t.title, t.artist));
    if (!list.length) { body.innerHTML = q ? emptyState({ icon: 'search', title: 'No matches' }) : emptyState({ icon: 'clock', title: 'Nothing played yet', text: 'Your listening history appears here.' }); return; }
    const key = regList(list, { type: 'library', name: 'Recently played' });
    body.innerHTML = `<div class="action-row"><button type="button" class="btn primary" data-act="playAll" data-list="${key}">${ic('play')} Play</button><button type="button" class="btn ghost" data-act="clearHistory">${ic('trash')} Clear history</button></div>
      <div class="rows" data-list="${key}">${list.map((t, i) => trackRow(t, { list: key, i })).join('')}</div>`;
  } else if (tab === 'downloads') {
    body.innerHTML = trackList(LIB.downloads, 'Downloads', emptyState({ icon: 'download', title: 'No downloads', text: 'Some artists on Audius allow downloads. When they do, a song’s ⋯ menu shows “Save for offline”. Songs that aren’t downloadable can only be streamed.' }));
  } else if (tab === 'local') {
    const supportsDir = 'webkitdirectory' in document.createElement('input');
    const empty = emptyState({ icon: 'folder', title: 'Play music from this device', text: 'Choose MP3, WAV, FLAC, M4A or other audio files. They stay on your device. SONORA never uploads them.', action: { label: 'Choose files', act: 'addLocal' } });
    if (!LOCAL.length) { body.innerHTML = empty; return; }
    const bar = `<div class="action-row"><button type="button" class="btn ghost" data-act="addLocal">${ic('upload')} Add music</button>${supportsDir ? `<button type="button" class="btn ghost" data-act="addFolder">${ic('folder')} Add folder</button>` : ''}
      <span class="muted count">${LOCAL.length ? plural(LOCAL.length, 'song') + ' · ' + fmtBytes(LOCAL.reduce((n, t) => n + (t.size || 0), 0)) : ''}</span></div>`;
    const sess = LOCAL.some(t => t.session) ? `<p class="notice-inline">${ic('info')} Some files are only held for this session${PREFS.rememberLocal ? ' because device storage was unavailable or full' : ' because “Remember local music” is off'}.</p>` : '';
    body.innerHTML = bar + sess + trackList(LOCAL, 'On this device', empty);
  }
}

/* ==========================================================================
   PLAYLIST (user) + Liked songs
   ========================================================================== */
function buildPlaylist(el, { id }) {
  let reorder = false;
  const get = () => id === 'liked'
    ? { id: 'liked', name: 'Liked songs', desc: '', cover: '', tracks: LIB.liked.map(x => x.t), virtual: true }
    : Lib.playlist(id);
  const render = () => {
    const y = el.scrollTop, p = get();
    if (!p) { el.innerHTML = topbar({ back: true }) + `<div class="pad">${emptyState({ icon: 'music', title: 'Playlist not found', text: 'It may have been deleted.' })}</div>`; return; }
    const n = p.tracks.length, ctx = { type: 'playlist', id: p.id, name: p.name };
    const key = regList(p.tracks, ctx);
    el.innerHTML = `${topbar({ back: true, actions: p.virtual ? '' : `<button class="icon-btn" type="button" data-act="plEdit" data-id="${esc(p.id)}" aria-label="Edit playlist details">${ic('edit')}</button><button class="icon-btn" type="button" data-act="plMenu" data-id="${esc(p.id)}" aria-label="Playlist options">${ic('more')}</button>` })}
      <div class="pad">${heroDetail({ art: p.virtual ? likedArt() : plArt(p), eyebrow: 'Playlist', title: p.name, desc: p.desc, meta: `${plural(n, 'song')}${n ? ' · ' + fmtDur(sumDur(p.tracks)) : ''}` })}
      <div class="action-row">
        <button type="button" class="btn primary" data-act="playAll" data-list="${key}" ${n ? '' : 'disabled'}>${ic('play')} Play</button>
        <button type="button" class="btn ghost" data-act="shuffleAll" data-list="${key}" ${n ? '' : 'disabled'}>${ic('shuffle')} Shuffle</button>
        ${p.virtual ? '' : `<button type="button" class="btn ghost" data-act="plAddSongs" data-id="${esc(p.id)}">${ic('plus')} Add songs</button>`}
        ${!p.virtual && n > 1 ? `<button type="button" class="btn ghost ${reorder ? 'on' : ''}" data-act="plReorder" aria-pressed="${reorder}">${ic('grip')} ${reorder ? 'Done' : 'Reorder'}</button>` : ''}
      </div>
      ${n ? `<div class="rows ${reorder ? 'reorder' : ''}" data-list="${key}">${p.tracks.map((t, i) => trackRow(t, { list: key, i, plid: p.virtual ? '' : p.id, grip: reorder })).join('')}</div>`
        : emptyState({ icon: 'music', title: p.virtual ? 'No liked songs yet' : 'This playlist is empty', text: p.virtual ? 'Tap the heart on any song.' : 'Add songs from search, or from any song’s ⋯ menu.', action: p.virtual ? null : { label: 'Add songs', act: 'plAddSongs', data: { id: p.id } } })}
      </div>`;
    el.scrollTop = y;
    if (reorder && !p.virtual) makeSortable($('.rows', el), (from, to) => Lib.moveInPlaylist(p.id, from, to));
  };
  el._toggleReorder = () => { reorder = !reorder; render(); };
  render();
  watch(el, 'lib', k => { if (['playlists', 'liked', 'all', 'local'].includes(k)) render(); });
  watch(el, 'player:track', () => { /* row highlight handled globally */ });
}

/* "Add songs" sheet: search + your library, tap + to add */
function openAddSongs(plid) {
  const p = Lib.playlist(plid); if (!p) return;
  let seq = 0;
  Sheet.open({
    title: `Add to ${p.name}`, cls: 'tall',
    html: `<div class="search-field">${ic('search')}<input id="addsongs-q" type="search" autocomplete="off" placeholder="Search songs to add" aria-label="Search songs to add"></div><div id="addsongs-res" class="rows"></div>`,
    onMount: body => {
      const resBox = $('#addsongs-res', body), inp = $('#addsongs-q', body);
      const draw = (tracks, note) => {
        const have = new Set((Lib.playlist(plid) || { tracks: [] }).tracks.map(t => t.id));
        const key = regList(tracks, { type: 'search' });
        resBox.innerHTML = (note ? `<p class="muted">${esc(note)}</p>` : '') + tracks.map((t, i) => `<div class="row" data-tid="${esc(t.id)}">
          <div class="row-art-wrap">${artEl(t, 'sm', 'row-art')}</div>
          <div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-sub"><span>${esc(t.artist)}</span></div></div>
          <button type="button" class="btn small ${have.has(t.id) ? 'ghost on' : 'primary'}" data-act="addSongTo" data-tid="${esc(t.id)}" data-plid="${esc(plid)}" ${have.has(t.id) ? 'disabled' : ''}>${have.has(t.id) ? 'Added' : 'Add'}</button></div>`).join('');
      };
      const lib = uniqBy([...LOCAL, ...LIB.liked.map(x => x.t), ...LIB.history.map(x => x.t)], t => t.id).slice(0, 12);
      draw(lib, lib.length ? 'From your library. Search to find more.' : 'Type to search.');
      const run = debounce(async q => {
        const my = ++seq; if (!q) { draw(lib, 'From your library. Search to find more.'); return; }
        resBox.innerHTML = skelRows(4);
        const r = await searchAll(q);
        if (my !== seq) return;
        const mine = libraryMatches(q).tracks;
        const all = uniqBy([...mine, ...r.tracks], t => t.id).slice(0, 40);
        if (!all.length) resBox.innerHTML = r.errors.length ? errorState({ kind: r.errors[0].kind, message: r.errors[0].msg }) : emptyState({ icon: 'search', title: 'No songs found' });
        else draw(all);
      }, 300);
      inp.addEventListener('input', () => run(inp.value.trim()));
      watch(body, 'lib', k => { if (k === 'playlists') { const cur = $$('[data-act="addSongTo"]', body); const p2 = Lib.playlist(plid); if (!p2) return; const have = new Set(p2.tracks.map(t => t.id)); cur.forEach(b => { if (have.has(b.dataset.tid)) { b.disabled = true; b.textContent = 'Added'; b.className = 'btn small ghost on'; } }); } });
    }
  });
}

/* create / edit playlist dialog with optional cover upload */
async function playlistDialog(existing) {
  let cover = existing ? existing.cover : '';
  const res = await askText({
    title: existing ? 'Edit playlist' : 'New playlist', label: 'Name', value: existing ? existing.name : '', placeholder: 'My playlist', okLabel: existing ? 'Save' : 'Create',
    extra: `<label class="field-label" for="ask-desc">Description (optional)</label><textarea id="ask-desc" class="field" rows="2" maxlength="300" placeholder="What is this playlist for?">${esc(existing ? existing.desc : '')}</textarea>
      <div class="cover-pick"><div class="cover-prev" id="cover-prev">${cover ? `<img src="${esc(cover)}" alt="">` : ic('music')}</div>
      <div><button type="button" class="btn ghost small" id="cover-btn">${ic('upload')} ${cover ? 'Change cover' : 'Add cover image'}</button>
      <button type="button" class="btn ghost small" id="cover-clear" ${cover ? '' : 'hidden'}>Remove</button><input type="file" id="cover-file" accept="image/*" hidden></div></div>`,
    onMount: body => {
      const file = $('#cover-file', body), prev = $('#cover-prev', body), clr = $('#cover-clear', body);
      $('#cover-btn', body).addEventListener('click', () => file.click());
      clr.addEventListener('click', () => { cover = ''; prev.innerHTML = ic('music'); clr.hidden = true; });
      file.addEventListener('change', async () => {
        if (!file.files[0]) return;
        try { cover = await imageToCover(file.files[0]); prev.innerHTML = `<img src="${cover}" alt="">`; clr.hidden = false; }
        catch { toast('That image couldn’t be read. Try a JPEG or PNG.', { kind: 'warn' }); }
      });
    }
  });
  if (!res) return null;
  return { name: res.value, desc: $('#ask-desc', res.root) ? $('#ask-desc', res.root).value : '', cover };
}

/* ==========================================================================
   ALBUM / PLAYLIST (Audius) and Daily Mix
   ========================================================================== */
function buildListView(el, { id }) {
  const e = ENT.get(id) || LIB.savedLists.find(x => x.id === id);
  if (!e) { el.innerHTML = topbar({ back: true }) + `<div class="pad">${emptyState({ icon: 'disc', title: 'Not found', text: 'Open it again from Home or Search.' })}</div>`; return; }
  rememberEnt(e);
  if (e.kind !== 'mix') Lib.addRecentItem(e.kind, e);
  const isMix = e.kind === 'mix';
  let tracks = isMix ? e.tracks : null, err = null;
  const draw = () => {
    const y = el.scrollTop;
    const saved = !isMix && Lib.isSavedList(e.id);
    const eyebrow = isMix ? 'Made for you' : e.kind === 'album' ? 'Album' : 'Playlist';
    const key = tracks ? regList(tracks, { type: 'list', id: e.id, name: e.name }) : '';
    const by = e.artist ? `<p class="hero-by">By ${e.artistId ? `<button type="button" class="link-btn" data-act="openArtistById" data-aid="${esc(e.artistId)}" data-name="${esc(e.artist)}">${esc(e.artist)}</button>` : esc(e.artist)}</p>` : '';
    el.innerHTML = `${topbar({ back: true })}
      <div class="pad">${heroDetail({ art: isMix ? mixArt(e) : artEl(e, 'lg'), eyebrow, title: e.name, desc: isMix ? `${e.personal ? 'Built from your listening' : 'A starter mix from popular ' + e.genre + ' tracks'}. Generated on this device.` : e.desc, byHtml: by, meta: tracks ? `${plural(tracks.length, 'song')}${sumDur(tracks) ? ' · ' + fmtDur(sumDur(tracks)) : ''}` : (e.count ? plural(e.count, 'song') : '') })}
      <div class="action-row">
        <button type="button" class="btn primary" data-act="playAll" data-list="${key}" ${tracks && tracks.length ? '' : 'disabled'}>${ic('play')} Play</button>
        <button type="button" class="btn ghost" data-act="shuffleAll" data-list="${key}" ${tracks && tracks.length ? '' : 'disabled'}>${ic('shuffle')} Shuffle</button>
        ${isMix ? `<button type="button" class="btn ghost" data-act="saveMix" data-eid="${esc(e.id)}">${ic('plus')} Save as playlist</button>`
          : `<button type="button" class="btn ghost ${saved ? 'on' : ''}" data-act="saveList" data-eid="${esc(e.id)}" aria-pressed="${saved}">${ic('heart')} ${saved ? 'Saved' : 'Save'}</button>
             <button type="button" class="btn ghost" data-act="copyToPlaylist" data-eid="${esc(e.id)}" data-list="${key}" ${tracks && tracks.length ? '' : 'disabled'}>${ic('list')} Copy to my playlist</button>`}
      </div>
      ${err ? errorState(err, { act: 'retryList', data: { eid: e.id } }) : tracks === null ? skelRows(8)
        : tracks.length ? `<div class="rows" data-list="${key}">${tracks.map((t, i) => trackRow(t, { list: key, i, numbered: !isMix && e.kind === 'album' })).join('')}</div>`
          : emptyState({ icon: 'music', title: 'No tracks', text: 'This list has no playable tracks right now.' })}
      ${e.perm ? `<p class="attrib"><a href="${esc(e.perm)}" target="_blank" rel="noopener">Open on Audius</a></p>` : ''}</div>`;
    el.scrollTop = y;
  };
  el._reload = async () => {
    err = null; tracks = null; draw();
    try { tracks = await Audius.listTracks(e.rid); } catch (x) { err = x; }
    if (el.isConnected) draw();
  };
  draw();
  if (!isMix) el._reload();
  watch(el, 'lib', k => { if (k === 'saved') draw(); });
}

/* ==========================================================================
   ARTIST
   ========================================================================== */
function buildArtist(el, { id }) {
  let a = ENT.get(id) || LIB.followed.find(x => x.id === id);
  if (!a) { el.innerHTML = topbar({ back: true }) + `<div class="pad">${emptyState({ icon: 'user', title: 'Artist not found' })}</div>`; return; }
  rememberEnt(a);
  Lib.addRecentItem('artist', { id: a.id, rid: a.rid, src: a.src, name: a.name, handle: a.handle, img150: a.img150, img480: a.img480, followers: a.followers });
  let tracks = null, err = null;
  const draw = () => {
    const y = el.scrollTop, following = Lib.isFollowing(a.id);
    const key = tracks ? regList(tracks, { type: 'artist', id: a.id, name: a.name }) : '';
    el.innerHTML = `${topbar({ back: true })}
      <div class="pad"><div class="hero-detail artist-hero"><div class="hero-art round">${artEl({ id: a.id, name: a.name, img150: a.img150, img480: a.img480 }, 'lg', 'round')}</div>
        <div class="hero-text"><span class="eyebrow">Artist</span><h1 class="hero-title">${esc(a.name)}</h1>
        <p class="hero-meta">${a.followers ? fmtNum(a.followers) + ' followers' : ''}${a.handle ? (a.followers ? ' · ' : '') + '@' + esc(a.handle) : ''}</p></div></div>
      <div class="action-row">
        <button type="button" class="btn primary" data-act="playAll" data-list="${key}" ${tracks && tracks.length ? '' : 'disabled'}>${ic('play')} Play</button>
        <button type="button" class="btn ghost" data-act="shuffleAll" data-list="${key}" ${tracks && tracks.length ? '' : 'disabled'}>${ic('shuffle')} Shuffle</button>
        <button type="button" class="btn ghost ${following ? 'on' : ''}" data-act="followArtist" data-aid="${esc(a.id)}" aria-pressed="${following}">${ic(following ? 'check' : 'plus')} ${following ? 'Following' : 'Follow'}</button></div>
      <section class="sec">${sectionHead('Popular tracks')}
      ${err ? errorState(err, { act: 'retryArtist', data: { aid: a.id } }) : tracks === null ? skelRows(6)
        : tracks.length ? `<div class="rows" data-list="${key}">${tracks.map((t, i) => trackRow(t, { list: key, i })).join('')}</div>` : emptyState({ icon: 'music', title: 'No tracks found', text: 'This artist has no playable tracks right now.' })}</section>
      ${a.perm || a.handle ? `<p class="attrib"><a href="${esc(a.perm || 'https://audius.co/' + a.handle)}" target="_blank" rel="noopener">Open on Audius</a></p>` : ''}</div>`;
    el.scrollTop = y;
  };
  el._reload = async () => {
    err = null; tracks = null; draw();
    try {
      tracks = a.src === 'jamendo' ? await Jamendo.tracks({ artist_id: a.rid, order: 'popularity_total', limit: 25 }) : await Audius.userTracks(a.rid, { limit: 30 });
      if (a.src === 'audius') Audius.user(a.rid).then(u => { if (u && el.isConnected) { a = { ...a, ...u, id: a.id }; rememberEnt(a); draw(); } }).catch(() => { });
    } catch (x) { err = x; }
    if (el.isConnected) draw();
  };
  draw(); el._reload();
  watch(el, 'lib', k => { if (k === 'followed') draw(); });
}

/* ==========================================================================

   ========================================================================== */
function buildStats(el) {
  const draw = () => {
    const s = LIB.stats, days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ k: dayKey(d), label: d.toLocaleDateString(undefined, { weekday: 'short' }), sec: s.byDay[dayKey(d)] || 0 }); }
    const max = Math.max(60, ...days.map(d => d.sec));
    const topA = Object.entries(s.artists).sort((a, b) => b[1].n - a[1].n).slice(0, 5);
    const topG = Object.entries(s.genres).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const none = !s.seconds && !s.plays;
    const bars = (rows, fmt) => { const m = Math.max(1, ...rows.map(r => r[1])); return `<ul class="hbars">${rows.map(([k, v]) => `<li><span class="hb-label">${esc(k)}</span><span class="hb-track"><i style="width:${(v / m) * 100}%"></i></span><span class="hb-val">${fmt(v)}</span></li>`).join('')}</ul>`; };
    el.innerHTML = `${topbar({ back: true, title: 'Listening stats' })}<div class="pad">
      ${none ? emptyState({ icon: 'chart', title: 'No listening yet', text: 'Play some music and your stats will build up here. They stay on this device.' }) : `
      <div class="stat-grid">
        <div class="stat"><span class="stat-n">${fmtDur(s.seconds)}</span><span class="stat-l">Time listened</span></div>
        <div class="stat"><span class="stat-n">${s.plays}</span><span class="stat-l">Songs played</span></div>
        <div class="stat"><span class="stat-n">${LIB.liked.length}</span><span class="stat-l">Liked songs</span></div>
        <div class="stat"><span class="stat-n">${LIB.playlists.length}</span><span class="stat-l">Playlists</span></div></div>
      <section class="sec">${sectionHead('Last 7 days')}<div class="daybars" role="img" aria-label="Minutes listened per day">${days.map(d => `<div class="db"><div class="db-col"><i style="height:${Math.max(2, d.sec / max * 100)}%" title="${Math.round(d.sec / 60)} min"></i></div><span class="db-min">${Math.round(d.sec / 60)}</span><span class="db-day">${d.label}</span></div>`).join('')}</div><p class="muted">Minutes listened per day.</p></section>
      ${topA.length ? `<section class="sec">${sectionHead('Top artists')}${bars(topA.map(([k, v]) => [k, v.n]), v => plural(v, 'play'))}</section>` : ''}
      ${topG.length ? `<section class="sec">${sectionHead('Top genres')}${bars(topG, v => plural(v, 'play'))}</section>` : ''}`}</div>`;

}

async function npBackground(t) {
