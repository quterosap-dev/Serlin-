<style>
/* SONORA — layout: one scroll container per view, bottom nav + mini-player on phones, side rail on wide screens.
   Palette: warm charcoal surfaces, one ember→rose accent, violet only in the logo and artwork gradients.
   Type: Sora (display, echoes the name) + Inter (text). */
:root {
  color-scheme: dark;
  --bg: #0e0e11; --bg-2: #131317; --surface: #1a1a1f; --surface-2: #232329; --surface-3: #2e2e36;
  --line: rgba(255, 245, 235, .08); --line-2: rgba(255, 245, 235, .16);
  --fg: #f4f1ec; --fg-2: #bab5ae; --fg-3: #85807a;
  --accent: #ff6a3d; --accent-2: #ff3d7f; --on-accent: #190f0b; --accent-soft: rgba(255, 106, 61, .16); --accent-text: #ff8a63;
  --ok: #3ddc97; --warn: #ffb21e; --danger: #ff5d5d;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .6);
  --font-display: 'Sora', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-h: 62px; --mini-h: 66px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f3ef; --bg-2: #efebe5; --surface: #ffffff; --surface-2: #f0ece6; --surface-3: #e5e0d8;
    --line: rgba(30, 20, 10, .09); --line-2: rgba(30, 20, 10, .18);
    --fg: #17151a; --fg-2: #55504a; --fg-3: #645e57;
    --accent-soft: rgba(255, 106, 61, .14); --accent-text: #b0310c;
    --shadow: 0 12px 30px rgba(40, 20, 0, .16); --scrim: rgba(20, 12, 5, .45);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f3ef; --bg-2: #efebe5; --surface: #ffffff; --surface-2: #f0ece6; --surface-3: #e5e0d8;
  --line: rgba(30, 20, 10, .09); --line-2: rgba(30, 20, 10, .18);
  --fg: #17151a; --fg-2: #55504a; --fg-3: #645e57;
  --accent-soft: rgba(255, 106, 61, .14); --accent-text: #b0310c;
  --shadow: 0 12px 30px rgba(40, 20, 0, .16); --scrim: rgba(20, 12, 5, .45);
}
:root[data-accent="iris"] { --accent: #8f7cff; --accent-2: #d86bff; --on-accent: #120d26; --accent-soft: rgba(143, 124, 255, .18); --accent-text: #b1a4ff; }
:root[data-accent="lagoon"] { --accent: #2fd1b4; --accent-2: #3da9ff; --on-accent: #06201b; --accent-soft: rgba(47, 209, 180, .16); --accent-text: #52e0c6; }
:root[data-accent="sun"] { --accent: #ffb21e; --accent-2: #ff6a3d; --on-accent: #211500; --accent-soft: rgba(255, 178, 30, .16); --accent-text: #ffc552; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"])[data-accent="iris"] { --accent-text: #4f38d6; }
  :root:not([data-theme="dark"])[data-accent="lagoon"] { --accent-text: #086b5b; }
  :root:not([data-theme="dark"])[data-accent="sun"] { --accent-text: #855400; }
}
:root[data-theme="light"][data-accent="iris"] { --accent-text: #4f38d6; }
:root[data-theme="light"][data-accent="lagoon"] { --accent-text: #086b5b; }
:root[data-theme="light"][data-accent="sun"] { --accent-text: #855400; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
a { color: var(--accent-text); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--fg-2); }
.spacer { flex: 1; }
.center { display: flex; justify-content: center; padding: 18px 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.eyebrow { font: 600 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }

/* ---------- shell ---------- */
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#views { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding-bottom: 20px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.view.pushed { background: var(--bg); z-index: 2; }
.pad { padding: 4px max(16px, 3vw) 28px; max-width: 1120px; margin: 0 auto; }
#netbar { display: flex; gap: 10px; align-items: center; padding: 8px 14px; font-size: 13px; line-height: 1.35; flex: none; }
#netbar[hidden] { display: none; }
#netbar.off { background: var(--surface-3); }
#netbar.warn { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
#netbar .ic { width: 18px; height: 18px; }

.topbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px max(8px, 2vw); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-title { font-size: 22px; font-weight: 700; padding-left: 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding-left: 8px; }
.logo { width: 34px; height: 34px; border-radius: 10px; display: block; }
.wordmark { font: 700 17px var(--font-display); letter-spacing: .2em; }
.greet { font-size: clamp(26px, 6.4vw, 36px); font-weight: 700; margin: 6px 0 14px; }

.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--fg); flex: none; transition: background .15s, color .15s, transform .12s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.92); }
.icon-btn:disabled { opacity: .4; }
.icon-btn.big { width: 48px; height: 48px; }
.like.on, .row-like.on, .mini-like.on { color: var(--accent); }
.like.on .ic, .row-like.on .ic, .mini-like.on .ic { fill: currentColor; }
.link-btn { color: var(--accent-text); font-weight: 600; padding: 4px 2px; }
.link-btn:disabled { color: inherit; opacity: .8; cursor: default; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; transition: transform .12s, background .15s, opacity .15s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.btn.ghost { border-color: var(--line-2); background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost.on { border-color: var(--accent); color: var(--accent-text); }
.btn.ghost.on .ic { fill: currentColor; }
.btn.danger { background: var(--danger); color: #1b0606; }
.btn.ghost.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-pair { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-pair.stack { flex-direction: column; align-items: stretch; margin-top: 12px; }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 16px; }
.count { margin-left: auto; font-size: 13px; }

/* ---------- artwork ---------- */
.art { position: relative; aspect-ratio: 1; width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface-2); isolation: isolate; }
.art.round { border-radius: 50%; }
.art-ch { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(22px, 7vw, 44px) var(--font-display); color: rgba(255, 255, 255, .55); z-index: 0; }
.art-ch .ic { width: 38%; height: 38%; stroke-width: 1.6; }
.art img.artimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.art img.artimg.err { display: none; }
.art.collage { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.art.collage img.artimg { position: static; }
.art.liked-art { background: linear-gradient(145deg, #7c5cff, #ff3d7f 70%, #ff9a3d); }
.art.liked-art .art-ch { color: #fff; }
.art.liked-art .ic { fill: #fff; stroke: none; }
.art.new-art { background: var(--surface-2); border: 2px dashed var(--line-2); display: grid; place-items: center; color: var(--fg-2); }
.art.new-art .ic { width: 36%; height: 36%; }
.art.mix .mix-label { position: absolute; left: 10px; bottom: 10px; z-index: 2; font: 700 15px var(--font-display); color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.art.mix.collage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, .65)); z-index: 1; }

/* ---------- shelves, cards ---------- */
.sec { margin-top: 26px; min-width: 0; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { font-size: 20px; font-weight: 700; }
.sec-sub { color: var(--fg-2); font-size: 13px; margin-top: 2px; }
.shelf { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 max(16px, 3vw); margin: 0 calc(-1 * max(16px, 3vw)); padding: 4px max(16px, 3vw) 10px; scrollbar-width: none; overscroll-behavior-x: contain; }
.shelf::-webkit-scrollbar { display: none; }
.shelf > .card { flex: 0 0 148px; scroll-snap-align: start; }
.shelf.note { display: block; overflow: visible; }
.shelf-note { padding: 18px; border-radius: 14px; background: var(--surface); color: var(--fg-2); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 18px 14px; }
.card { display: block; min-width: 0; text-align: left; cursor: pointer; border-radius: 16px; }
.card-art { position: relative; border-radius: 14px; }
.card-art .art { box-shadow: 0 6px 18px rgba(0, 0, 0, .28); transition: transform .18s; }
.card:hover .card-art .art { transform: translateY(-2px); }
.card-play { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); opacity: 0; transform: translateY(6px); transition: .18s; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); z-index: 3; }
.card:hover .card-play, .card:focus-visible .card-play { opacity: 1; transform: none; }
.card.is-current .card-art::after { content: ""; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 2.5px var(--accent); pointer-events: none; z-index: 3; }
.card-more { position: absolute; left: 6px; top: 6px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, .55); color: #fff; z-index: 3; opacity: .92; }
.card-more .ic { width: 18px; height: 18px; }
.card-title { margin-top: 9px; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-sub { color: var(--fg-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.artist { text-align: center; }
.card.new-card { color: inherit; }
.card.skel { pointer-events: none; }
.sk { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 10px; }
.sk.line { height: 12px; margin-top: 9px; width: 82%; }
.sk.line.short { width: 52%; height: 10px; }
.row.skel { pointer-events: none; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* continue listening */
.continue { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 20px; background: linear-gradient(120deg, var(--accent-soft), transparent 70%), var(--surface); border: 1px solid var(--line); cursor: pointer; }
.cont-art { width: 84px; flex: none; }
.cont-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.cont-title { font: 700 17px var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-sub { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-bar { height: 4px; border-radius: 4px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
.cont-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.cont-time { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.fab { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); flex: none; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
.fab .ic { width: 24px; height: 24px; }
.attrib { margin-top: 28px; font-size: 12.5px; color: var(--fg-3); }

/* ---------- rows ---------- */
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 4px 7px 6px; border-radius: 14px; cursor: pointer; transition: background .12s; min-width: 0; }
.row:hover { background: var(--surface); }
.row-art-wrap { position: relative; width: 50px; flex: none; }
.row-art { border-radius: 9px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 13px; min-width: 0; }
.row-sub span:not(.badge) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-dur { color: var(--fg-3); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.row-num { width: 22px; text-align: center; color: var(--fg-3); font-variant-numeric: tabular-nums; flex: none; }
.row.is-current .row-title { color: var(--accent-text); }
.row.is-unavail { opacity: .5; }
.row-grip { width: 32px; height: 40px; display: grid; place-items: center; color: var(--fg-3); touch-action: none; cursor: grab; flex: none; }
.row.dragging { background: var(--surface-2); box-shadow: var(--shadow); z-index: 4; transition: none; }
.rows.is-dragging .row:not(.dragging) { transition: transform .14s; }
.q-row.is-past { opacity: .5; }
.badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--fg-2); flex: none; white-space: nowrap; }
.badge.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }
.badge.local { background: var(--accent-soft); color: var(--accent-text); }
.eqbars { position: absolute; inset: 0; border-radius: 9px; background: rgba(0, 0, 0, .55); display: none; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 14px; z-index: 2; }
.eqbars i { width: 4px; background: var(--accent); border-radius: 2px; height: 6px; animation: eq 0.9s ease-in-out infinite; }
.eqbars i:nth-child(2) { animation-delay: .2s; } .eqbars i:nth-child(3) { animation-delay: .4s; }
.row.is-playing .eqbars { display: flex; }
@keyframes eq { 0%, 100% { height: 5px; } 50% { height: 20px; } }

/* ---------- chips, toolbar, search ---------- */
.chips { display: flex; gap: 8px; align-items: center; }
.chips.scroll { overflow-x: auto; padding: 4px max(16px, 3vw) 8px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 15px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; font-weight: 500; flex: none; }
.chip .ic { width: 16px; height: 16px; color: var(--fg-3); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.chip-x { display: inline-flex; align-items: center; }
.chip-x .chip { border-radius: 999px 0 0 999px; }
.chip-del { width: 32px; min-height: 38px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 0; border-radius: 0 999px 999px 0; color: var(--fg-3); }
.chip-del .ic { width: 14px; height: 14px; }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 2px max(16px, 3vw) 6px; flex-wrap: wrap; }
.toolbar .search-field { flex: 1 1 180px; }
.searchbar { padding: 4px max(16px, 3vw) 8px; position: sticky; top: 56px; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); }
.search-field { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 6px 0 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.search-field:focus-within { border-color: var(--accent); }
.search-field.small { min-height: 40px; }
.search-field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; font-size: 16px; padding: 10px 0; -webkit-appearance: none; appearance: none; }
.search-field input::placeholder { color: var(--fg-3); }
.search-field input::-webkit-search-cancel-button { display: none; }
.search-field > .ic { color: var(--fg-3); width: 20px; height: 20px; }
.sugg { display: flex; flex-direction: column; margin: 6px 0 2px; }
.sugg-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 8px; border-radius: 10px; text-align: left; }
.sugg-item:hover { background: var(--surface); }
.sugg-item .ic { color: var(--fg-3); width: 18px; height: 18px; }
.loading-line { display: flex; align-items: center; gap: 10px; color: var(--fg-2); padding: 14px 4px; }
.spin, .spinner { animation: spin 1s linear infinite; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; display: inline-block; flex: none; }
.spinner.big { width: 28px; height: 28px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- explore tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tile { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; display: block; width: 100%; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); transition: transform .15s; }
.tile:active { transform: scale(.98); }
.tiles.small .tile { aspect-ratio: 16 / 9; }
.cat-art { position: absolute; inset: 0; overflow: hidden; }
.cat-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cat-label { position: absolute; left: 13px; top: 12px; right: 12px; text-align: left; font: 700 17px/1.15 var(--font-display); color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, .35); }
.banners { display: flex; flex-direction: column; gap: 10px; }
.banner { position: relative; display: flex; align-items: center; gap: 14px; padding: 8px 14px 8px 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.banner .cat-art { position: relative; width: 112px; height: 64px; border-radius: 11px; flex: none; }
.banner .cat-label { font-size: 13.5px; left: 9px; top: 9px; right: 6px; }
.banner-desc { flex: 1; min-width: 0; color: var(--fg-2); font-size: 13.5px; }
.cat-hero { position: relative; height: 150px; border-radius: 20px; overflow: hidden; margin-top: 4px; }
.cat-hero .cat-label { font-size: 28px; left: 20px; top: auto; bottom: 18px; }
.cat-note { margin: 12px 0 0; font-size: 13.5px; }

/* ---------- detail hero ---------- */
.hero-detail { display: flex; gap: 20px; align-items: flex-end; margin: 8px 0 4px; flex-wrap: wrap; }
.hero-art { width: min(220px, 56vw); flex: none; margin: 0 auto; }
.hero-art .art { box-shadow: var(--shadow); }
.hero-text { flex: 1 1 260px; min-width: 0; display: grid; gap: 6px; }
.hero-title { font-size: clamp(26px, 7vw, 44px); font-weight: 800; line-height: 1.08; overflow-wrap: anywhere; }
.hero-desc { color: var(--fg-2); }
.hero-by, .hero-meta { color: var(--fg-2); font-size: 14px; }

/* ---------- empty / notices ---------- */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 44px 24px; color: var(--fg-2); }
.empty.compact { padding: 22px 16px; }
.empty h3 { color: var(--fg); font-size: 18px; }
.empty p { max-width: 42ch; }
.empty-ic { width: 40px; height: 40px; color: var(--fg-3); stroke-width: 1.5; }
.notice { display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); margin: 14px 0; align-items: flex-start; }
.notice.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.notice p { color: var(--fg-2); margin: 2px 0 8px; font-size: 13.5px; }
.notice-inline { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--fg-2); margin: 8px 0; }
.notice-inline.warn { color: var(--warn); }
.notice-inline .ic { width: 18px; height: 18px; margin-top: 1px; }
.hint { margin-top: 14px; font-size: 13.5px; }

/* ---------- mini player ---------- */
.mini { position: relative; flex: none; display: flex; align-items: center; gap: 2px; margin: 0 8px 6px; padding: 7px 6px 9px 7px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); overflow: hidden; }
.mini[hidden] { display: none; }
.mini-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
.mini-art { width: 46px; flex: none; }
.mini-art .art { border-radius: 10px; }
.mini-text { min-width: 0; }
.mini-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-sub { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini.is-err .mini-sub { color: var(--warn); }
.mini-play { background: var(--fg); color: var(--bg); }
.mini-play:hover { background: var(--fg); }
.mini-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line-2); }
.mini-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s linear; }

/* ---------- bottom nav / rail ---------- */
.nav { flex: none; display: flex; background: var(--bg-2); border-top: 1px solid var(--line); min-height: var(--nav-h); }
.rail-brand { display: none; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg-3); font-size: 11.5px; font-weight: 600; min-height: var(--nav-h); transition: color .15s; }
.nav-btn .ic { width: 24px; height: 24px; transition: transform .15s; }
.nav-btn.on { color: var(--accent-text); }
.nav-btn.on .ic { transform: translateY(-1px); }
.nav-btn.on .ic { fill: color-mix(in srgb, currentColor 18%, transparent); }

@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: auto 1fr auto; }
  #netbar { grid-column: 2; grid-row: 1; }
  #views { grid-column: 2; grid-row: 2; }
  #mini { grid-column: 2; grid-row: 3; margin: 0 14px 12px; }
  .nav { grid-column: 1; grid-row: 1 / 4; flex-direction: column; justify-content: flex-start; gap: 4px; padding: 18px 12px; border-top: 0; border-right: 1px solid var(--line); }
  .rail-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
  .nav-btn { flex: none; flex-direction: row; justify-content: flex-start; gap: 14px; min-height: 48px; padding: 0 14px; border-radius: 12px; font-size: 15px; }
  .nav-btn:hover { background: var(--surface); }
  .nav-btn.on { background: var(--accent-soft); }
  .home-top .brand { display: none; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .tiles.small { grid-template-columns: repeat(4, 1fr); }
  .hero-art { margin: 0; }
}
@media (min-width: 600px) and (max-width: 899px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 400px) { .row-dur { display: none; } .hero-art { width: min(190px, 52vw); } }

/* ---------- now playing ---------- */
.np { position: fixed; inset: 0; z-index: 60; background: var(--bg); transform: translateY(102%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); overflow: hidden; color: #f6f3ee; }
.np[hidden] { display: none; }
.np.in { transform: none; }
.np-bg, .np-bg > div { position: absolute; inset: 0; }
.np-bg > div { opacity: 0; transition: opacity .9s ease; background: linear-gradient(180deg, var(--c1, #333), var(--c2, #111) 72%, #0b0b0d); overflow: hidden; }
.np-bg > div.on { opacity: 1; }
.np-bg-img { position: absolute; inset: -15%; width: 130%; height: 130%; object-fit: cover; filter: blur(46px) saturate(1.4); opacity: .5; }
.np-inner { position: relative; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 6px) 22px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.np .icon-btn { color: #f6f3ee; }
.np .icon-btn:hover { background: rgba(255, 255, 255, .12); }
.np-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
.np-ctx { display: grid; justify-items: center; text-align: center; min-width: 0; gap: 3px; }
.np-ctx .eyebrow { color: rgba(255, 255, 255, .65); }
.np-ctx #np-ctx { font-weight: 600; font-size: 13px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-art-wrap { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 0 14px; container-type: size; }
.np-art { width: min(100cqw, 100cqh); aspect-ratio: 1; border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); }
.np-art .art { height: 100%; border-radius: 18px; }
.np-art.pop { animation: pop .45s cubic-bezier(.2, .9, .3, 1); }
@keyframes pop { from { transform: scale(.92); opacity: .2; } to { transform: none; opacity: 1; } }
.np-info { display: flex; align-items: center; gap: 10px; flex: none; }
.np-titles { flex: 1; min-width: 0; }
.np-title { font: 700 clamp(20px, 5.4vw, 26px)/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-artist { display: block; max-width: 100%; margin-top: 3px; font-size: 16px; color: rgba(255, 255, 255, .82); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-artist:not(:disabled):hover { text-decoration: underline; }
.np-album { font-size: 13px; color: rgba(255, 255, 255, .6); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-seek { flex: none; margin-top: 10px; }
.np-times { display: flex; justify-content: space-between; font-size: 12.5px; color: rgba(255, 255, 255, .7); font-variant-numeric: tabular-nums; margin-top: -4px; }
.np-status { flex: none; min-height: 22px; font-size: 13px; color: rgba(255, 255, 255, .8); display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.np-status .link-btn { color: #fff; text-decoration: underline; }
.st-err { display: inline-flex; gap: 6px; align-items: center; color: #ffd27a; } .st-err .ic { width: 16px; height: 16px; }
.st-wait { display: inline-flex; gap: 8px; align-items: center; }
.np-controls { flex: none; display: flex; align-items: center; justify-content: space-between; margin: 2px 0 6px; }
.np .ctl { width: 48px; height: 48px; color: rgba(255, 255, 255, .72); }
.np .ctl.lg { width: 56px; height: 56px; color: #fff; } .np .ctl.lg .ic { width: 30px; height: 30px; }
.np .ctl.on { color: var(--accent); }
.np .ctl.rep { position: relative; }
.np .ctl.rep.one::after { content: "1"; position: absolute; right: 9px; top: 9px; font: 700 10px var(--font-body); background: var(--accent); color: var(--on-accent); width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; }
.play-btn { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #111; box-shadow: 0 10px 26px rgba(0, 0, 0, .4); transition: transform .12s; flex: none; }
.play-btn:active { transform: scale(.94); }
.play-btn .ic { width: 32px; height: 32px; }
.np-vol { flex: none; display: flex; align-items: center; gap: 4px; margin: 2px 0 4px; }
.np-vol input { flex: 1; }
.np-tools { flex: none; display: flex; justify-content: space-between; gap: 4px; padding-top: 6px; }
.tool { position: relative; display: grid; justify-items: center; gap: 4px; min-width: 56px; padding: 6px 4px; border-radius: 12px; font-size: 11.5px; color: rgba(255, 255, 255, .78); }
.tool:hover { background: rgba(255, 255, 255, .1); }
.tool.on { color: var(--accent); }
.tool-count { position: absolute; top: 0; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; display: grid; place-items: center; }
.tool-count:empty { display: none; }
@media (max-height: 640px) { .np-art-wrap { padding: 4px 0 8px; } .np-vol { display: none; } .play-btn { width: 62px; height: 62px; } }
@media (min-width: 900px) { .np-inner { max-width: 600px; } }

/* range inputs */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; cursor: pointer; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--rf, #fff) var(--p), var(--rb, rgba(255, 255, 255, .28)) var(--p)); }
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--rb, rgba(255, 255, 255, .28)); }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--rf, #fff); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5.5px; border-radius: 50%; background: var(--rf, #fff); border: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--rf, #fff); border: 0; }
input[type=range]:disabled { opacity: .45; cursor: default; }
.sheet input[type=range], .settings input[type=range] { --rf: var(--accent); --rb: var(--line-2); }
#np-vol { --p: 100%; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .22s; pointer-events: auto; }
.sheet { position: relative; width: min(100%, 580px); max-height: 90%; display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border-radius: 24px 24px 0 0; box-shadow: var(--shadow); transform: translateY(104%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); pointer-events: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.tall { height: min(88%, 780px); }
.sheet-wrap.in .scrim { opacity: 1; }
.sheet-wrap.in .sheet { transform: none; }
.sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 9px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0 20px; flex: none; }
.sheet-head h3 { font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow-y: auto; padding: 8px 16px 20px; min-height: 0; flex: 1; overscroll-behavior: contain; }
.sheet.tall .sheet-body { display: flex; flex-direction: column; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; max-height: 86%; } }
.menu { display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 10px; border-radius: 12px; text-align: left; width: 100%; text-decoration: none; color: inherit; }
.menu-item:hover { background: var(--surface-2); }
.menu-item .ic { color: var(--fg-2); }
.menu-item small { margin-left: auto; color: var(--fg-3); font-size: 12px; }
.menu-item.danger, .menu-item.danger .ic { color: var(--danger); }
.menu-item:disabled { opacity: .4; }
.pl-item { min-height: 58px; }
.mini-thumb { width: 42px; flex: none; }
.mini-thumb .art { border-radius: 8px; }
.ts-head { display: flex; gap: 14px; align-items: center; padding: 8px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.ts-art { width: 76px; flex: none; }
.ts-text { min-width: 0; display: grid; gap: 3px; }
.ts-title { font: 700 18px/1.2 var(--font-display); overflow-wrap: anywhere; }
.ts-artist { color: var(--fg-2); }
.ts-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.form { display: grid; gap: 10px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.field { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); color: inherit; font: inherit; font-size: 16px; resize: vertical; }
.field:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.small { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.dialog-text { margin-bottom: 14px; }
.cover-pick { display: flex; gap: 14px; align-items: center; margin-top: 4px; }
.cover-prev { width: 72px; height: 72px; border-radius: 12px; background: var(--surface-3); display: grid; place-items: center; color: var(--fg-3); overflow: hidden; flex: none; }
.cover-prev img { width: 100%; height: 100%; object-fit: cover; }
.cover-prev .ic { width: 28px; height: 28px; }
.queue-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
#q-list, #addsongs-res { overflow-y: auto; flex: 1; min-height: 0; }
.ly-body { overflow-y: auto; flex: 1; min-height: 0; }
.ly-head { margin-bottom: 12px; }
.ly-lines { display: grid; gap: 10px; padding: 10px 0 20px; }
.ly { font-size: 18px; line-height: 1.4; color: var(--fg-2); transition: color .2s, transform .2s; }
.ly-lines.synced .ly { font-size: 20px; font-weight: 600; color: var(--fg-3); }
.ly-lines.synced .ly.on { color: var(--fg); transform: translateX(4px); }
.snd-sec { padding: 6px 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.snd-sec:last-child { border-bottom: 0; }
.snd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.snd-head h4 { font: 700 16px var(--font-display); }
.snd-note { font-size: 12.5px; margin-top: 8px; }
.eq-bands { display: flex; justify-content: space-between; gap: 6px; margin-top: 14px; }
.eq-bands.off { opacity: .5; }
.eq-band { display: grid; justify-items: center; gap: 6px; flex: 1; }
.eq-band input[type=range] { width: 130px; transform: rotate(-90deg); margin: 52px -40px; }
.eq-val { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.eq-f { font-size: 11px; color: var(--fg-3); }

/* ---------- settings ---------- */
.set-sec { margin-top: 26px; }
.set-sec h2 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.set-text { flex: 1 1 220px; min-width: 0; }
.set-label { font-weight: 600; }
.set-desc { color: var(--fg-2); font-size: 13px; margin-top: 2px; }
.set-ctl { flex: 0 1 auto; max-width: 100%; }
.set-ctl .field { min-width: min(280px, 100%); }
.switch { position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--surface-3); transition: background .18s; flex: none; }
.switch i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(20px); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--fg-2); }
.seg button.on { background: var(--fg); color: var(--bg); }
.swatches { display: flex; gap: 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--line-2); }
.swatch.on { box-shadow: 0 0 0 2.5px var(--fg); }
.range-wrap { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.range-wrap output { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-3); }
.pill.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.account-card { display: flex; gap: 14px; padding: 14px; border-radius: 16px; background: var(--surface); }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; flex: none; color: var(--fg-2); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 18px; margin: 0; }
.keys > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.keys dt { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.keys dd { margin: 0; color: var(--fg-2); text-align: right; }

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 8px; }
.stat { display: grid; gap: 4px; padding: 16px; border-radius: 16px; background: var(--surface); }
.stat-n { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
.stat-l { color: var(--fg-2); font-size: 13px; }
.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 170px; }
.db { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; height: 100%; gap: 4px; }
.db-col { width: 100%; max-width: 38px; height: 100%; display: flex; align-items: flex-end; background: var(--surface); border-radius: 8px; overflow: hidden; }
.db-col i { display: block; width: 100%; background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 8px 8px 0 0; }
.db-min { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.db-day { font-size: 11.5px; color: var(--fg-3); }
.hbars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hbars li { display: grid; grid-template-columns: minmax(80px, 28%) 1fr auto; align-items: center; gap: 10px; }
.hb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hb-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.hb-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; }
.hb-val { font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }

/* ---------- toasts ---------- */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 14px); z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }
body.has-mini #toasts { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + var(--mini-h) + 12px); }
body.np-open #toasts { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
@media (min-width: 900px) { #toasts { bottom: 90px; } body.has-mini #toasts { bottom: 100px; } }
.toast { display: flex; align-items: center; gap: 14px; max-width: min(520px, 100%); padding: 12px 16px; border-radius: 14px; background: var(--fg); color: var(--bg); box-shadow: var(--shadow); font-size: 14px; opacity: 0; transform: translateY(10px); transition: .22s; pointer-events: auto; }
.toast.in { opacity: 1; transform: none; }
.toast.warn { background: #3a2a08; color: #ffe2a6; border: 1px solid #7a5a12; }
.toast-act { font-weight: 700; color: var(--accent-2); white-space: nowrap; }
.toast.warn .toast-act { color: #ffc552; }
:root[data-theme="light"] .toast-act { color: var(--accent-text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

<script>
/* ---- 00-util.js ---- */
/* ==========================================================================
   SONORA — 00 util: DOM helpers, formatting, event bus, icons, toasts
   ========================================================================== */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => Date.now();
const arr = v => (Array.isArray(v) ? v : []);

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.cancel = () => clearTimeout(t);
  return d;
}

function throttle(fn, ms) {
  let last = 0, timer = null;
  return (...a) => {
    const n = Date.now();
    if (n - last >= ms) { last = n; fn(...a); }
    else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); fn(...a); }, ms - (n - last));
  };
}

/* ---------- formatting ---------- */
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
function fmtDur(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  if (h && m) return `${h} hr ${m} min`;
  if (h) return `${h} hr`;
  return `${Math.max(1, m)} min`;
}
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(n);
}
function plural(n, one, many) { return `${n} ${n === 1 ? one : (many || one + 's')}`; }
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(b >= 10 || i === 0 ? 0 : 1)} ${u[i]}`;
}
function dayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Good night';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

/* ---------- colour helpers (artwork fallbacks, dynamic backgrounds) ---------- */
function hashStr(s) {
  let h = 2166136261;
  s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hueOf(seed) { return hashStr(seed) % 360; }
function gradFor(seed) {
  const h = hashStr(seed), h1 = h % 360, h2 = (h1 + 38 + ((h >> 8) % 70)) % 360;
  return `linear-gradient(135deg, hsl(${h1} 72% 52%), hsl(${h2} 70% 30%))`;
}
function shuffled(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function uniqBy(list, keyFn) {
  const seen = new Set(), out = [];
  for (const x of list) { const k = keyFn(x); if (k == null || seen.has(k)) continue; seen.add(k); out.push(x); }
  return out;
}

/* ---------- event bus ---------- */
const Bus = {
  m: {},
  on(e, f) { (this.m[e] = this.m[e] || []).push(f); return () => this.off(e, f); },
  off(e, f) { this.m[e] = (this.m[e] || []).filter(x => x !== f); },
  emit(e, ...a) { (this.m[e] || []).slice().forEach(f => { try { f(...a); } catch (err) { console.error('[bus]', e, err); } }); }
};

  el: null,

/* copy text with a fallback for browsers/frames that refuse the async clipboard API */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}

/* read a file and return a downscaled square JPEG data URL (playlist covers) */
async function imageToCover(file, size = 480, q = 0.82) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  bmp.close && bmp.close();
  return c.toDataURL('image/jpeg', q);
}

/* ---- 01-storage.js ---- */
/* ==========================================================================
   SONORA — 01 storage: localStorage (prefs + library) and IndexedDB (audio blobs)
   Cloud-sync readiness: every record carries id + updatedAt, deletions are kept
   as tombstones, and all writes go through saveLib(), which calls Sync.push().
   ========================================================================== */

/* ---------- localStorage wrapper with in-memory fallback ---------- */
const memStore = {};
let lsOK = true;
try { localStorage.setItem('sonora.__t', '1'); localStorage.removeItem('sonora.__t'); } catch { lsOK = false; }
const LS = {
  ok: lsOK,
  frozen: false,            // set while wiping: nothing may be written back (pagehide handlers would undo the wipe)
  get(k, d) {
    try {
      const raw = lsOK ? localStorage.getItem('sonora.' + k) : memStore[k];
      return raw == null ? d : JSON.parse(raw);
    } catch { return d; }
  },
  set(k, v) {
    if (this.frozen) return false;
    try {
      const s = JSON.stringify(v);
      if (lsOK) localStorage.setItem('sonora.' + k, s); else memStore[k] = s;
      return true;
    } catch (e) { Bus.emit('storage-error', e); return false; }
  },
  del(k) { try { if (lsOK) localStorage.removeItem('sonora.' + k); else delete memStore[k]; } catch { /* ignore */ } },
  clearAll() {
    this.frozen = true;
    Object.keys(memStore).forEach(k => delete memStore[k]);
    try { Object.keys(localStorage).filter(k => k.startsWith('sonora.')).forEach(k => localStorage.removeItem(k)); } catch { /* ignore */ }
  }
};

/* ---------- IndexedDB wrapper (files, meta, offline) ---------- */
const IDB = {
  ok: true, _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise(res => {
      try {
        const r = indexedDB.open('sonora', 1);
        r.onupgradeneeded = () => { ['files', 'meta', 'offline'].forEach(s => r.result.createObjectStore(s)); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => { this.ok = false; res(null); };
        r.onblocked = () => { this.ok = false; res(null); };
      } catch { this.ok = false; res(null); }
    });
    return this._p;
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    if (!db) throw new Error('Device storage (IndexedDB) is not available here.');
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      let out;
      const req = fn(t.objectStore(store));
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage write was aborted (quota?)'));
    });
  },
  get(s, k) { return this.tx(s, 'readonly', o => o.get(k)); },
  put(s, k, v) { return this.tx(s, 'readwrite', o => o.put(v, k)); },
  del(s, k) { return this.tx(s, 'readwrite', o => o.delete(k)); },
  all(s) { return this.tx(s, 'readonly', o => o.getAll()); },
  keys(s) { return this.tx(s, 'readonly', o => o.getAllKeys()); },
  clear(s) { return this.tx(s, 'readwrite', o => o.clear()); }
};

/* ---- 02-providers.js ---- */
/* ==========================================================================
   SONORA — 02 providers: network layer + Audius (primary), Jamendo (optional,
   needs a free client_id), Internet Archive (optional, experimental)
   --------------------------------------------------------------------------
   Audius endpoints used (documented in Audius' public OpenAPI spec):
     GET /v1/tracks/trending?genre&time&limit&offset
     GET /v1/tracks/search?query&limit&sort_method&mood
     GET /v1/tracks/{id}/stream            (302 -> mp3; Range supported)
   Used on the strength of Audius' public REST docs, not re-read in this build
   (failures degrade gracefully):
     GET /v1/users/search?query            GET /v1/playlists/search?query
     GET /v1/playlists/trending            GET /v1/playlists/{id}/tracks
     GET /v1/users/{id}/tracks             GET /v1/users/{id}
   ========================================================================== */

const NET = { state: 'ok', failed: new Set(), online: navigator.onLine };
function setNet(state, provider) {
  if (state === 'ok') { if (provider) NET.failed.delete(provider); else NET.failed.clear(); if (!NET.failed.size) NET.state = 'ok'; }
  else if (state === 'fail') { NET.failed.add(provider); NET.state = 'fail'; }
  else NET.state = state;
  Bus.emit('net');
}

class ApiError extends Error {
  constructor(msg, { status, kind } = {}) { super(msg); this.status = status; this.kind = kind; }
}

const CACHE = new Map();
const INFLIGHT = new Map();
const CACHE_MAX = 250;

async function jget(url, { signal, ttl = 300000, provider = 'Audius' } = {}) {
  const hit = CACHE.get(url);
  if (hit && Date.now() - hit.t < ttl) return hit.v;
  if (!signal && INFLIGHT.has(url)) return INFLIGHT.get(url);
  const run = (async () => {
    let res;
    try {
      res = await fetch(url, { signal, headers: { Accept: 'application/json' } });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new ApiError('aborted', { kind: 'abort' });
      if (!navigator.onLine) { NET.online = false; setNet('offline'); throw new ApiError('You are offline.', { kind: 'offline' }); }
      setNet('fail', provider);
      throw new ApiError(`Can't reach ${provider}.`, { kind: 'network' });
    }
    if (!res.ok) {
      const msg = res.status === 429 ? `${provider} is rate-limiting requests. Try again in a minute.`
        : res.status >= 500 ? `${provider} is having problems (${res.status}).`
          : `${provider} returned an error (${res.status}).`;
      throw new ApiError(msg, { status: res.status, kind: 'http' });
    }
    let j;
    try { j = await res.json(); } catch { throw new ApiError(`${provider} sent an unreadable response.`, { kind: 'parse' }); }
    setNet('ok', provider);
    CACHE.set(url, { t: Date.now(), v: j });
    if (CACHE.size > CACHE_MAX) CACHE.delete(CACHE.keys().next().value);
    return j;
  })();
  if (!signal) INFLIGHT.set(url, run);
  try { return await run; } finally { INFLIGHT.delete(url); }
}
/* stale-while-error: if the network fails but we have an older copy, use it */
async function jgetStale(url, opts) {
  try { return await jget(url, opts); } catch (e) {
    const hit = CACHE.get(url);
    if (hit && e.kind !== 'abort') return hit.v;
    throw e;
  }
}
const errMsg = e => (e && e.message) || 'Something went wrong.';

/* ---------- Audius ---------- */

    album: (r.album_backlink && r.album_backlink.playlist_name) || '',

    dl: !!access.download,

const Audius = {
  name: 'Audius',
  base() { return (PREFS.audiusHost || 'https://api.audius.co').replace(/\/+$/, '') + '/v1'; },

      if (v == null || v === '') continue;

  async data(path, params, opts) {

  name: 'Internet Archive',

  async search(q, { rows = 15 } = {}, o) {

    const u = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(qq)}&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=licenseurl&rows=${rows}&output=json&sort[]=downloads+desc`;
    const j = await jgetStale(u, { provider: 'Internet Archive', ttl: 120000, ...o });

      id: 'ia:' + d.identifier, src: 'archive', rid: d.identifier, title: d.title || d.identifier,
      artist: Array.isArray(d.creator) ? d.creator[0] : (d.creator || 'Unknown'), album: '', dur: 0,
      art480: `https://archive.org/services/img/${encodeURIComponent(d.identifier)}`, art150: `https://archive.org/services/img/${encodeURIComponent(d.identifier)}`,
      genre: '', perm: `https://archive.org/details/${encodeURIComponent(d.identifier)}`, stream: true,

    }));

    for (const f of pref) {

/* ---------- aggregate helpers ---------- */
function interleave(...lists) {
  const out = [], max = Math.max(0, ...lists.map(l => l.length));
  for (let i = 0; i < max; i++) lists.forEach(l => { if (l[i]) out.push(l[i]); });
  return uniqBy(out, t => t.id);
}
const providerCount = () => 1 + (Jamendo.enabled() ? 1 : 0) + (Archive.enabled() ? 1 : 0);

/* search across every enabled provider; one provider failing never hides the others */
async function searchAll(q, { signal } = {}) {
  const o = { signal };
  const jobs = {
    tracks: Audius.searchTracks(q, { limit: 25 }, o),
    artists: Audius.searchUsers(q, {}, o),
    lists: Audius.searchLists(q, {}, o)
  };
  if (Jamendo.enabled()) jobs.jtracks = Jamendo.search(q, o);
  if (Archive.enabled()) jobs.atracks = Archive.search(q, {}, o);
  const keys = Object.keys(jobs);
  const res = await Promise.allSettled(keys.map(k => jobs[k]));
  const out = { tracks: [], artists: [], lists: [], errors: [] };
  const got = {};
  res.forEach((r, i) => {
    if (r.status === 'fulfilled') got[keys[i]] = r.value;
    else if (!(r.reason && r.reason.kind === 'abort')) out.errors.push({ part: keys[i], msg: errMsg(r.reason), kind: r.reason && r.reason.kind });
  });
  out.tracks = interleave(got.tracks || [], got.jtracks || [], got.atracks || []);
  out.artists = got.artists || [];
  out.lists = got.lists || [];
  out.aborted = res.some(r => r.status === 'rejected' && r.reason && r.reason.kind === 'abort');
  return out;
}

/* ---------- playable source resolution ---------- */
async function resolveSources(t) {
  if (t.src === 'local') {
    const blob = await getLocalBlob(t);
    if (!blob) throw new ApiError('This local file is no longer available. Add it again from your device.', { kind: 'missing' });
    return { urls: [URL.createObjectURL(blob)], blob: true };
  }
  const off = await getOfflineBlob(t.id).catch(() => null);
  if (off) return { urls: [URL.createObjectURL(off)], blob: true };
  if (t.stream === false) throw new ApiError('This track is not available for streaming.', { kind: 'unavailable' });
  if (t.src === 'audius') {
    const urls = [Audius.streamUrl(t)];
    if (t.alt && t.alt !== urls[0]) urls.push(t.alt);
    return { urls };
  }
  if (t.src === 'jamendo') return { urls: [t.audio] };
  if (t.src === 'archive') return { urls: [await Archive.resolve(t)] };
  throw new ApiError('Unknown music source.', { kind: 'unavailable' });
}
