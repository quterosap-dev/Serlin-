    E.setEqGains(PREFS.eq.gains); const o = $('#eqv' + i); if (o) o.textContent = (v > 0 ? '+' : '') + v;
    $$('[data-act="eqPreset"]').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
  } else if (k === 'crossfade') {
    const o = $('#cf-out'), o2 = $('#snd-cf'); const txt = v ? v + ' s' : 'Off'; if (o) o.textContent = txt; if (o2) o2.textContent = txt;
  }
});
document.addEventListener('change', e => {
  const r = e.target.closest && e.target.closest('[data-range]'); if (r) {
    const v = +r.value, k = r.dataset.range;
    if (k === 'eq') setPref('eq', PREFS.eq);
    else if (k === 'crossfade') { setPref('crossfade', v); npTools(); }
    return;
  }
  const f = e.target.closest && e.target.closest('[data-field]'); if (!f) return;
  const k = f.dataset.field; let v = f.value.trim();
  if (k === 'audiusHost') {
    if (!/^https?:\/\/[^\s]+$/i.test(v)) { toast('Enter a full address starting with https://', { kind: 'warn' }); f.value = PREFS.audiusHost; return; }
    v = v.replace(/\/+$/, ''); CACHE.clear();
  }
  if (k === 'jamendoId') CACHE.clear();
  setPref(k, v); toast('Saved.');
  if (k === 'jamendoId' || k === 'audiusHost') { NAVS.built.home = false; NAVS.built.explore = false; }
});

/* ==========================================================================
   ADD TO PLAYLIST
   ========================================================================== */
let PENDING_ADD = [];
function openAddToPlaylist(tracks) {
  PENDING_ADD = arr(tracks).filter(Boolean);
  if (!PENDING_ADD.length) return;
  const pls = LIB.playlists.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  Sheet.open({
    title: 'Add to playlist', cls: 'tall',
    html: `<div class="menu"><button type="button" class="menu-item" data-act="addToNewPl" data-close>${ic('plus')}<span>New playlist</span></button>
      ${pls.map(p => `<button type="button" class="menu-item pl-item" data-act="addToPl" data-plid="${esc(p.id)}" data-close><span class="mini-thumb">${plArt(p)}</span><span>${esc(p.name)}</span><small>${plural(p.tracks.length, 'song')}</small></button>`).join('')}</div>
      ${pls.length ? '' : '<p class="muted hint">You have no playlists yet. Create one above.</p>'}`
  });
}

/* ---------- helpers ---------- */
function artistEntityFromTrack(t) {
  if (!t || !t.artistId) return null;
  return rememberEnt({ id: t.artistId, rid: String(t.artistId).slice(3), src: t.src, name: t.artist, handle: t.handle || '', img480: t.uimg || '', img150: t.uimg150 || '', followers: t.ufol || 0 });
}
function openArtistOf(t) {
  const a = ENT.get(t.artistId) || artistEntityFromTrack(t);
  if (!a) { toast('No artist page for this song.'); return; }
  unwindToView();
  go('artist', { id: a.id });
}
function slimList(e) {
  return { id: e.id, rid: e.rid, src: e.src, kind: e.kind, name: e.name, art150: e.art150, art480: e.art480, artist: e.artist, artistId: e.artistId, count: e.count, desc: e.desc, perm: e.perm };
}
function playFromEl(el, { shuffle = false } = {}) {
  const t = trackOf(el); if (!t) return;
  const L = LISTS.get(el.dataset.list);
  if (el.closest('#tab-search')) { Lib.addSearch(SS.q); Lib.addRecentItem('track', slim(t)); }
  const cur = curTrack();
  if (cur && cur.id === t.id && !PS.error && Q.list.length) { PL.toggle(); return; }
  if (isUnavail(t)) { toast('This track isn’t available for streaming.', { kind: 'warn' }); return; }
  if (L) PL.play(L.tracks, +el.dataset.i || 0, L.ctx, { shuffle }); else PL.playTrack(t);
}
async function setEq(on) {
  if (on) { const ok = await E.enableEQ(); if (!ok) return; PREFS.eq.on = true; }
  else { E.disableEQ(); PREFS.eq.on = false; }
  setPref('eq', PREFS.eq); Bus.emit('eq'); npTools();
}
async function handleImport(files) {
  if (!files || !files.length) return;
  const t = toast(`Reading ${plural(files.length, 'file')}…`, { ms: 60000 });
  const r = await importFiles(files, { onProgress: (i, n, name) => { if (t) { const m = t.querySelector('.toast-msg'); if (m) m.textContent = `Adding ${i} of ${n}: ${name}`; } } });
  if (t) t.remove();
  const bits = [];
  if (r.added.length) bits.push(`Added ${plural(r.added.length, 'song')}`);
  if (r.dupes) bits.push(`${r.dupes} already in your library`);
  if (r.failed.length) bits.push(`${r.failed.length} couldn’t be played by this browser (${r.failed.slice(0, 2).join(', ')}${r.failed.length > 2 ? '…' : ''})`);
  if (r.skipped) bits.push(`${r.skipped} not audio`);
  toast(bits.join('. ') + '.', { kind: r.added.length ? '' : 'warn', ms: 5200, action: r.added.length ? { label: 'Play', fn: () => PL.play(r.added, 0, { type: 'local', name: 'On this device' }) } : null });
  if (r.added.length) { LST.tab = 'local'; markDirty('library'); }
  const hasSess = r.added.some(x => x.session);
  if (hasSess && PREFS.rememberLocal) toast('These files couldn’t be saved to device storage, so they’ll be gone after you close SONORA.', { kind: 'warn', ms: 6000 });
}

/* ==========================================================================
   Track details + actions sheet
   ========================================================================== */
function openTrackSheet(t, { list = '', i = 0, plid = '' } = {}) {
  if (!t) return;
  rememberTrack(t);
  const liked = Lib.isLiked(t), isLocal = t.src === 'local', off = Offline.has(t.id);
  const srcName = isLocal ? 'On this device' : t.src === 'audius' ? 'Audius' : t.src === 'jamendo' ? 'Jamendo' : 'Internet Archive';
  const chips = [t.genre, t.dur ? fmtTime(t.dur) : '', t.plays ? fmtNum(t.plays) + ' plays' : '', srcName, t.license ? 'Creative Commons' : '', t.year || ''].filter(Boolean);
  const d = { tid: t.id, list, i };
  const items = [
    { icon: 'play', label: 'Play', act: 'menuPlay', data: d },
    { icon: 'next', label: 'Play next', act: 'menuNext', data: { tid: t.id } },
    { icon: 'list', label: 'Add to queue', act: 'menuQueue', data: { tid: t.id } },
    { icon: 'heart', label: liked ? 'Remove from Liked songs' : 'Add to Liked songs', act: 'like', data: { tid: t.id } },
    { icon: 'plus', label: 'Add to playlist…', act: 'menuAddPl', data: { tid: t.id } },
    plid ? { icon: 'trash', label: 'Remove from this playlist', act: 'menuRemovePl', data: { tid: t.id, plid, i } } : null,
    plid && i > 0 ? { icon: 'arrow-up', label: 'Move up', act: 'moveUp', data: { plid, i } } : null,
    plid && LISTS.get(list) && i < LISTS.get(list).tracks.length - 1 ? { icon: 'arrow-down', label: 'Move down', act: 'moveDown', data: { plid, i } } : null,
    t.artistId ? { icon: 'user', label: `Go to ${t.artist}`, act: 'goArtist', data: { tid: t.id } } : null,
    { icon: 'text', label: 'Lyrics', act: 'openLyrics', data: { tid: t.id } },
    !isLocal && t.dl && !off ? { icon: 'download', label: 'Save for offline', hint: 'Artist allows downloads', act: 'saveOffline', data: { tid: t.id } } : null,
    off ? { icon: 'trash', label: 'Remove offline copy', act: 'removeOffline', data: { tid: t.id } } : null,
    t.perm ? { icon: 'link', label: 'Copy link', act: 'copyLink', data: { tid: t.id } } : null,
    isLocal ? { icon: 'trash', label: 'Remove from this device library', danger: true, act: 'removeLocal', data: { tid: t.id } } : null
  ];
  Sheet.open({
    title: '', cls: 'track-sheet',
    html: `<div class="ts-head">${artEl(t, 'md', 'ts-art')}<div class="ts-text"><div class="ts-title">${esc(t.title)}</div><div class="ts-artist">${esc(t.artist)}${t.album ? ' · ' + esc(t.album) : ''}</div>
      <div class="ts-chips">${chips.map(c => `<span class="badge">${esc(c)}</span>`).join('')}</div></div></div>
      ${isUnavail(t) ? `<p class="notice-inline warn">${ic('alert')} This track isn’t available for streaming right now.</p>` : ''}
      ${menuItems(items)}
      ${t.perm ? `<p class="attrib"><a href="${esc(t.perm)}" target="_blank" rel="noopener">Open on ${esc(srcName)}</a>${t.license ? ` · <a href="${esc(t.license)}" target="_blank" rel="noopener">License</a>` : ''}</p>` : ''}`
  });
}

Object.assign(ACT, {
  /* navigation */

    { icon: 'upload', label: 'Import a SONORA backup', act: 'importLib' }]) }),

  menuPlay: el => { const t = trackOf(el), L = LISTS.get(el.dataset.list); if (isUnavail(t)) return toast('This track isn’t available for streaming.', { kind: 'warn' }); if (L) PL.play(L.tracks, +el.dataset.i || 0, L.ctx); else PL.playTrack(t); },

  moveUp: el => Lib.moveInPlaylist(el.dataset.plid, +el.dataset.i, +el.dataset.i - 1),

    if (curTrack() && curTrack().id === t.id) { PL.pause(); const i = Q.idx; if (Q.list.length > 1) { Q.list.splice(i, 1); Q.idx = Math.min(i, Q.list.length - 1); E.load(curTrack(), { autoplay: false }); } else { Q.list = []; Q.idx = -1; E.quiet(() => { E.d.el.removeAttribute('src'); }); renderMini(); } Bus.emit('queue'); }

      { icon: 'trash', label: 'Delete playlist', danger: true, act: 'plDelete', data: { id: p.id } }]) });
  },

  saveList: el => { const e = ENT.get(el.dataset.eid) || LIB.savedLists.find(x => x.id === el.dataset.eid); if (!e) return; const on = Lib.toggleSavedList(slimList(e)); toast(on ? 'Saved to your library' : 'Removed from your library', { ms: 1600 }); },

  },

    const k = el.dataset.pref, v = el.dataset.val;

  /* data */
  exportLib: () => {
    const json = Lib.exportJSON();
    Sheet.open({ title: 'Export library', cls: 'tall', html: `<p class="muted">Copy this text or download it as a file. Local music files aren’t included. Only their entries in playlists.</p>
      <textarea id="export-text" class="field mono" rows="10" readonly aria-label="Library backup">${esc(json)}</textarea>
      <div class="form-actions"><button type="button" class="btn ghost" id="export-copy">${ic('link')} Copy</button><button type="button" class="btn primary" id="export-dl">${ic('download')} Download file</button></div>`,
      onMount: body => {
        $('#export-copy', body).addEventListener('click', async () => toast((await copyText(json)) ? 'Copied' : 'Couldn’t copy. Select the text and copy it.', { ms: 1800 }));
        $('#export-dl', body).addEventListener('click', async () => {
          // Inside the Claude artifact viewer a plain download link is blocked; the viewer offers its own save call instead.
          let viewerSave = null;
          try { viewerSave = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch { viewerSave = null; }
          if (viewerSave) {
            try { await viewerSave.save({ filename: `sonora-backup-${dayKey()}.json`, data: json }); toast('Backup saved.', { ms: 2200 }); }
            catch (e) { if (!e || e.code !== 'declined') toast('Couldn’t save the file here. Use Copy instead.', { kind: 'warn' }); }
            return;
          }
          try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = `sonora-backup-${dayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('If nothing downloaded, use Copy instead.', { ms: 3000 }); }
          catch { toast('Downloading isn’t available here. Use Copy.', { kind: 'warn' }); }
        });
      } });
  },
  importLib: () => Sheet.open({ title: 'Import library', cls: 'tall', html: `<p class="muted">Paste a SONORA backup or choose the file. Items are merged. Nothing is deleted.</p>
      <textarea id="import-text" class="field mono" rows="8" placeholder='{"app":"SONORA", …}' aria-label="Backup text"></textarea>
      <div class="form-actions"><button type="button" class="btn ghost" id="import-file">${ic('upload')} Choose file</button><button type="button" class="btn primary" id="import-go">Import</button></div>`,
    onMount: body => {
      const ta = $('#import-text', body);
      $('#import-file', body).addEventListener('click', () => pickFile('.json,application/json', async f => { ta.value = await f.text(); }));
      $('#import-go', body).addEventListener('click', () => { try { const n = Lib.importJSON(ta.value); toast(n ? `Imported ${plural(n, 'item')}` : 'Nothing new to import', { ms: 2500 }); popTop(false); } catch (e) { toast(errMsg(e), { kind: 'warn' }); } });
    } }),
  clearHistory: () => { Lib.clearHistory(); toast('History cleared', { ms: 1500 }); },
  resetListening: async () => { if (await askConfirm({ title: 'Reset listening history?', text: 'This clears your play history and listening stats. Recommendations start fresh.', okLabel: 'Reset', danger: true })) { Lib.clearHistory(); Lib.resetStats(); toast('Reset', { ms: 1500 }); } },
  wipeAll: async () => {
    if (!(await askConfirm({ title: 'Delete everything?', text: 'Playlists, likes, follows, history, settings and local music will be removed from this device. This can’t be undone.', okLabel: 'Delete all', danger: true }))) return;
    PL.pause(); LS.clearAll();
    for (const s of ['files', 'meta', 'offline']) { try { await IDB.clear(s); } catch { /* ignore */ } }
    location.reload();
  },
  openShortcuts: () => Sheet.open({ title: 'Keyboard shortcuts', cls: 'dialog', html: `<dl class="keys">
    <div><dt>Space</dt><dd>Play / pause</dd></div><div><dt>← →</dt><dd>Seek 5 seconds</dd></div><div><dt>Shift + ← →</dt><dd>Previous / next</dd></div>
    <div><dt>↑ ↓</dt><dd>Volume</dd></div><div><dt>M</dt><dd>Mute</dd></div><div><dt>L</dt><dd>Like current song</dd></div>
    <div><dt>S / R</dt><dd>Shuffle / repeat</dd></div><div><dt>N / Q</dt><dd>Now playing / queue</dd></div><div><dt>/</dt><dd>Search</dd></div><div><dt>Esc</dt><dd>Close / go back</dd></div></dl>` })
});

/* ---- 11-boot.js ---- */
/* ==========================================================================
   SONORA — 11 boot: wiring, connectivity bar, keyboard shortcuts, file inputs
   ========================================================================== */

function renderNetbar() {
  const b = $('#netbar'); if (!b) return;
  if (NET.state === 'offline' || !navigator.onLine) {
    b.hidden = false; b.className = 'netbar off';
    b.innerHTML = `${ic('wifi-off')}<span>You’re offline. Playlists, likes and music on your device still work.</span>`;
  } else if (NET.state === 'fail') {
    b.hidden = false; b.className = 'netbar warn';
    b.innerHTML = `${ic('alert')}<span>Can’t reach ${esc([...NET.failed].join(', '))}. Check your connection. If you opened SONORA in a restricted preview, online music may be blocked there.</span><button type="button" class="link-btn" data-act="netRetry">Retry</button>`;
  } else { b.hidden = true; b.innerHTML = ''; }
}
ACT.netRetry = () => { CACHE.clear(); NET.failed.clear(); NET.state = 'ok'; renderNetbar(); ACT.homeRefresh(); if (SS.q) runSearch(SS.q); };

function wireEvents() {
  const tickUI = throttle(() => { miniTime(); if ($('#np.in')) npTime(); }, 200);
  Bus.on('player:time', tickUI);
  Bus.on('player:track', () => {
    renderMini(); if (UI_STACK.some(i => i.kind === 'np')) npRender(); refreshRows();
    if (NAVS.built.home) renderContinue(tabEl('home'));
  });
  Bus.on('player:state', () => {
    miniState(); if ($('#np.in')) npState(); refreshRows();
    if (NAVS.built.home) renderContinue(tabEl('home'));
  });
  Bus.on('queue', () => { npTools(); refreshRows(); if ($('#np.in')) { const c = $('#np-ctx'); if (c) c.textContent = ctxLabel(); } });
  Bus.on('sleep', npTools); Bus.on('sleep:tick', npTools);
  Bus.on('eq', npTools);
  Bus.on('lib', k => {
    if (['liked', 'all'].includes(k)) refreshHearts();
    if (['playlists', 'liked', 'saved', 'followed', 'history', 'downloads', 'all'].includes(k)) markDirty('library');
    if (['history', 'all'].includes(k) && NAVS.built.home) renderRecent(tabEl('home'));
  });
  Bus.on('local', () => markDirty('library'));
  Bus.on('net', renderNetbar);
  Bus.on('pref', k => { if (['volume', 'muted', 'shuffle', 'repeat'].includes(k) && $('#np.in')) npState(); if (['theme', 'accent', 'dataSaver'].includes(k)) applyTheme(); });
  addEventListener('online', () => {
    renderNetbar();
    if (NAVS.built.home && $$('#tab-home .shelf.note').length) { ACT.homeRefresh(); }
  });
  addEventListener('offline', renderNetbar);

  $('#file-local').addEventListener('change', e => handleImport(e.target.files));
  $('#file-folder').addEventListener('change', e => handleImport(e.target.files));
  addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
  addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); handleImport(e.dataTransfer.files); } });
  wireNP();
}

/* ---------- keyboard shortcuts ---------- */
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, tag = tg && tg.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable);
  if (e.key === 'Escape') {
    if (UI_STACK.length) { e.preventDefault(); popTop(false); }
    else if (typing) tg.blur();
    return;
  }
  if (typing) return;
  const onButton = tag === 'BUTTON' || tag === 'A' || (tg && tg.getAttribute && tg.getAttribute('role') === 'button');
  switch (e.key) {
    case ' ': if (onButton) return; e.preventDefault(); PL.toggle(); break;
    case 'ArrowLeft': e.preventDefault(); e.shiftKey ? PL.prev() : PL.seekRel(-5); break;
    case 'ArrowRight': e.preventDefault(); e.shiftKey ? PL.next() : PL.seekRel(5); break;
    case 'ArrowUp': e.preventDefault(); PL.setVolume(PREFS.volume + 0.05); break;
    case 'ArrowDown': e.preventDefault(); PL.setVolume(PREFS.volume - 0.05); break;
    case 'm': case 'M': PL.toggleMute(); break;
    case 'l': case 'L': ACT.npLike(); break;
    case 's': case 'S': ACT.shuffleToggle(); break;
    case 'r': case 'R': ACT.repeatToggle(); break;
    case 'n': case 'N': if (UI_STACK.some(i => i.kind === 'np')) closeNP(); else openNP(); break;
    case 'q': case 'Q': openQueue(); break;
    case '/': e.preventDefault(); showTab('search'); setTimeout(() => { const i = $('#search-input'); i && i.focus(); }, 30); break;
    case '?': ACT.openShortcuts(); break;
    default: return;
  }
});

function boot() {
  applyTheme();
  PL.init();
  wireEvents();
  renderNetbar();
  showTab('home');
  renderMini();
  loadLocalLibrary().then(() => { markDirty('library'); }).catch(() => { });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  // test / debugging hook; contains no secrets
  window.SONORA = { H, PL, Q, PS, E, PREFS, LIB, Lib, LOCAL, NET, Audius, CACHE, UI_STACK, ACT, Sleep, UNAVAIL, LS, IDB, setPref, showTab, go, importFiles, parseLyrics, readMeta, TR };
}
try { boot(); } catch (e) {
  console.error('[boot]', e);
  const v = $('#views'); if (v) v.innerHTML = `<div class="empty" style="padding:40px 20px"><h3>SONORA couldn’t start</h3><p>${esc(e && e.message)}</p></div>`;
}

</script>
